/* ============================================================
   CLOTHING PICKER – used on the Leave sign-out form.
   Slots: Upper, Layer (optional jacket etc.), Lower, Shoes, Hat (optional).
   Each slot = { t: item type, c: colour key, p: '' | 'striped' | 'dotted' }.
   A little figure (male / female) redraws live to match. The plain-English
   summary is saved as entry.clothing so exports, roll call and sign-in keep working.
============================================================ */
// Item choices per slot. len = sleeve / leg cut (see figure), hem = bottom edge of a top, nc = no colour needed.
const WEAR_ITEMS={
  upper:[{k:'tshirt',l:'T-shirt',sl:'short',hem:138},{k:'long',l:'Long sleeve top',sl:'long',hem:138},{k:'shirt',l:'Shirt',sl:'long',hem:140},
         {k:'jumper',l:'Jumper',sl:'long',hem:140},{k:'hoodie',l:'Hoodie',sl:'long',hem:144},{k:'sweat',l:'Sweatshirt',sl:'long',hem:140},{k:'vest',l:'Vest / strappy top',sl:'none',hem:134}],
  layer:[{k:'jacket',l:'Jacket',sl:'long',hem:142},{k:'coat',l:'Coat',sl:'long',hem:178},{k:'cardi',l:'Cardigan',sl:'long',hem:148},{k:'gilet',l:'Gilet',sl:'none',hem:140}],
  lower:[{k:'jeans',l:'Jeans',cut:236},{k:'joggers',l:'Joggers',cut:236},{k:'trousers',l:'Trousers',cut:236},{k:'leggings',l:'Leggings',cut:236},{k:'shorts',l:'Shorts',cut:176},{k:'skirt',l:'Skirt',skirt:1}],
  shoes:[{k:'trainers',l:'Trainers'},{k:'shoes',l:'Shoes'},{k:'boots',l:'Boots'},{k:'sandals',l:'Sandals'},{k:'slippers',l:'Slippers'},{k:'flip',l:'Flip-flops'},{k:'bare',l:'Barefoot',nc:1}],
  hat:[{k:'cap',l:'Cap'},{k:'beanie',l:'Beanie'},{k:'bucket',l:'Bucket hat'}]
};
const WEAR_SLOTS=[['upper','Upper'],['layer','Layer'],['lower','Lower'],['shoes','Shoes'],['hat','Hat']];
const WEAR_OPTIONAL={layer:'Add a layer (jacket, coat…)',hat:'Add a hat'};
// Colours: [key, name, hex]. Fixed real-world colours – they look the same in light and dark mode.
const WEAR_COLOURS={
  Basic:[['black','Black','#1b1b1d'],['white','White','#f5f5f2'],['grey','Grey','#8a9099'],['red','Red','#c62f2f'],['orange','Orange','#e8801f'],['yellow','Yellow','#f2cc2e'],
         ['green','Green','#2f9a55'],['blue','Blue','#2b6fd1'],['navy','Navy','#1c2f5a'],['purple','Purple','#7a45b5'],['pink','Pink','#ec7fae'],['brown','Brown','#7b5233']],
  Shades:[['charcoal','Charcoal','#3d4249'],['silver','Silver','#c3c8ce'],['cream','Cream','#efe6cf'],['beige','Beige','#d2bd98'],['tan','Tan','#b48a5a'],['khaki','Khaki','#8c8a55'],
         ['olive','Olive','#5d6b2f'],['dkgreen','Dark green','#1f5a3a'],['mint','Mint','#a8dcc0'],['teal','Teal','#1f8a8f'],['sky','Sky blue','#8fc3ee'],['ltblue','Light blue','#bcd8f2'],
         ['burgundy','Burgundy','#6e1e33'],['maroon','Maroon','#8a2424'],['coral','Coral','#f08272'],['lilac','Lilac','#c5b0e6']],
  Multi:[['multi','Multicoloured','#888'],['camo','Camouflage','#6b6a3c']]
};
const WEAR_COL={}; Object.values(WEAR_COLOURS).forEach(g=>g.forEach(c=>WEAR_COL[c[0]]={n:c[1],h:c[2]}));

let cw={}, cwOpen='upper', cwSex='M';
const cwClone=w=>JSON.parse(JSON.stringify(w||{}));
const wearItem=(slot,it)=>it&&WEAR_ITEMS[slot].find(x=>x.k===it.t);
const wearDone=(slot,it)=>{ const d=wearItem(slot,it); return !!d&&(d.nc||!!WEAR_COL[it.c]); };
// "Navy striped hoodie" – plain text used everywhere else in the app
function wearItemText(slot,it){
  const d=wearItem(slot,it); if(!d) return '';
  if(d.nc) return d.l.toLowerCase();
  const c=WEAR_COL[it.c]; if(!c) return d.l;
  return (c.n+' '+(it.p?it.p+' ':'')+d.l.toLowerCase()).replace(/^./,m=>m.toUpperCase());
}
function wearText(w){ return ['hat','layer','upper','lower','shoes'].map(s=>wearItemText(s,(w||{})[s])).filter(Boolean).join(', '); }
// Slots that still need completing before sign-out is allowed (Upper, Lower, Shoes always; Layer / Hat only if added)
function wearMissing(w){ return WEAR_SLOTS.filter(([s])=>(['upper','lower','shoes'].includes(s)||w[s])&&!wearDone(s,w[s])).map(x=>x[1]); }

/* ----- the figure (SVG, 140 x 270). Neutral mannequin – no skin tone is implied. ----- */
function lum(h){ const n=parseInt(h.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
function figPattern(id,it){
  const c=WEAR_COL[it.c]; if(!c) return '';
  if(it.c==='multi') return `<pattern id="${id}" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#2b6fd1"/><rect width="13" height="13" fill="#d33"/><rect x="13" y="13" width="13" height="13" fill="#f2cc2e"/><rect x="13" width="13" height="13" fill="#2f9a55"/></pattern>`;
  if(it.c==='camo') return `<pattern id="${id}" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#8c8a55"/><ellipse cx="8" cy="9" rx="8" ry="5" fill="#5d6b2f"/><ellipse cx="22" cy="20" rx="8" ry="6" fill="#4a3a28"/><ellipse cx="24" cy="5" rx="5" ry="3" fill="#3f4a24"/></pattern>`;
  const ink=lum(c.h)>.55?'#000':'#fff';
  const over=it.p==='striped'?`<rect y="1" width="9" height="3.2" fill="${ink}" opacity=".5"/>`:it.p==='dotted'?`<circle cx="4.5" cy="4.5" r="1.7" fill="${ink}" opacity=".55"/>`:'';
  return `<pattern id="${id}" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="${c.h}"/>${over}</pattern>`;
}
function figureSVG(w,sex,pre,active){
  w=w||{}; const F=sex==='F', sh=F?24:28, wa=F?19:23, hi=F?26:24, x0=70-sh;
  const fill=s=>wearDone(s,w[s])&&!wearItem(s,w[s]).nc?`url(#${pre}_${s})`:null;
  const defs=['upper','layer','lower','shoes','hat'].map(s=>fill(s)?figPattern(pre+'_'+s,w[s]):'').join('');
  const ln='stroke="rgba(0,0,0,.3)" stroke-width=".8"';
  const mir=inner=>`<g>${inner}</g><g transform="translate(140 0) scale(-1 1)">${inner}</g>`;       // draw left, mirror to right
  const arm=`M ${x0-2} 60 Q ${x0-8} 62 ${x0-9} 70 L ${x0-14} 128 L ${x0-3} 130 L ${x0+6} 74 Z`;
  const ao=70-hi+5, ai=62, leg=`M ${70-hi} 124 L 69 124 L ${ai} 240 L ${ao} 240 Z`;
  const torso=hem=>`M ${70-sh} 64 q0 -6 8 -6 h${2*sh-16} q8 0 8 6 L ${70+wa} 112 L ${70+hi} ${hem} H ${70-hi} L ${70-wa} 112 Z`;
  const g=(slot,inner)=>`<g class="slot ${active===slot?'on':''}" data-act="c_slot" data-v="${slot}">${inner}</g>`;
  let o=`<svg class="fig" viewBox="0 0 140 270" role="img" aria-label="Clothing preview"><defs>${defs}
    <clipPath id="${pre}_cL"><rect width="66" height="300"/><rect x="74" width="70" height="300"/></clipPath>
    <clipPath id="${pre}_c124"><rect width="140" height="124"/></clipPath><clipPath id="${pre}_c88"><rect width="140" height="88"/></clipPath>`
    +[176,236].map(n=>`<clipPath id="${pre}_k${n}"><rect width="140" height="${n}"/></clipPath>`).join('')+`</defs>`;
  // body (neutral)
  o+=`<g style="fill:var(--fig);stroke:var(--figline);stroke-width:.8">
      <rect x="64" y="42" width="12" height="20" rx="4"/>${mir(`<path d="${arm}"/><path d="${leg}"/><rect x="${ao-6}" y="236" width="${ai-ao+9}" height="12" rx="5"/>`)}
      <path d="${torso(136)}"/><circle cx="70" cy="30" r="16"/></g>`;
  // hair (dark neutral) – longer on the female figure
  o+=`<g fill="#4a4036">${F?`<path d="M53 30 Q50 10 70 10 Q90 10 87 30 L89 58 Q84 60 82 52 L82 30 Q82 20 70 18 Q58 20 58 30 L58 52 Q56 60 51 58 Z"/>`:`<path d="M54 27 Q53 10 70 10 Q87 10 86 27 Q80 18 70 18 Q60 18 54 27 Z"/>`}</g>`;
  // LOWER
  const lo=w.lower, ld=wearItem('lower',lo);
  if(fill('lower')){
    const f=fill('lower');
    if(ld.skirt) o+=g('lower',`<path d="M ${70-wa} 122 L ${70+wa} 122 L ${70+hi+9} 174 L ${70-hi-9} 174 Z" fill="${f}" ${ln}/>`);
    else o+=g('lower',`<rect x="${70-hi}" y="122" width="${2*hi}" height="14" fill="${f}" ${ln}/>`+mir(`<path d="${leg}" fill="${f}" ${ln} clip-path="url(#${pre}_k${ld.cut})"/>`));
  } else o+=g('lower',`<rect class="ghost" x="${70-hi}" y="122" width="${2*hi}" height="110" rx="6"/>`);
  // UPPER
  const up=w.upper, ud=wearItem('upper',up), sleeve=(d,f,clip)=>d.sl==='none'?'':mir(`<path d="${arm}" fill="${f}" ${ln} clip-path="url(#${pre}_${clip})"/>`);
  if(fill('upper')){
    const f=fill('upper');
    o+=g('upper',sleeve(ud,f,ud.sl==='long'?'c124':'c88')+`<path d="${torso(ud.hem)}" fill="${f}" ${ln}/>`+(ud.k==='hoodie'?`<path d="M ${70-12} 58 Q70 74 ${70+12} 58" fill="none" ${ln}/>`:''));
  } else o+=g('upper',`<path class="ghost" d="${torso(138)}"/>`);
  // LAYER (drawn open at the front so the top shows through)
  if(fill('layer')){
    const f=fill('layer'), d=wearItem('layer',w.layer);
    o+=g('layer',sleeve(d,f,'c124')+`<path d="${torso(d.hem)}" fill="${f}" ${ln} clip-path="url(#${pre}_cL)"/>`);
  }
  // SHOES
  const sd=wearItem('shoes',w.shoes);
  if(fill('shoes')&&sd.k!=='bare'){
    const f=fill('shoes'), k=sd.k, X=ao-7, W=ai-ao+11;
    let s=k==='boots'?`<rect x="${ao-2}" y="214" width="${ai-ao+4}" height="30" fill="${f}" ${ln}/><rect x="${X}" y="236" width="${W}" height="13" rx="5" fill="${f}" ${ln}/>`
      :(k==='sandals'||k==='flip')?`<rect x="${X}" y="246" width="${W}" height="4" rx="2" fill="${f}" ${ln}/><path d="M ${X+6} 246 L ${ao+3} 238 L ${X+W-6} 246" fill="none" stroke="${WEAR_COL[w.shoes.c].h}" stroke-width="2.4"/>`
      :`<rect x="${X}" y="${k==='slippers'?240:236}" width="${W}" height="${k==='slippers'?10:13}" rx="${k==='slippers'?6:5}" fill="${f}" ${ln}/>`+(k==='trainers'?`<rect x="${X}" y="246" width="${W}" height="3.5" rx="1.5" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width=".6"/>`:'');
    o+=g('shoes',mir(s));
  } else if(!w.shoes||!sd) o+=g('shoes',mir(`<rect class="ghost" x="${ao-7}" y="236" width="${ai-ao+11}" height="14" rx="5"/>`));
  else o+=g('shoes','');
  // HAT
  if(fill('hat')){
    const f=fill('hat'), k=w.hat.t;
    o+=g('hat',k==='cap'?`<path d="M54 28 Q54 9 70 9 Q86 9 86 28 Z" fill="${f}" ${ln}/><path d="M72 26 h24 q3 0 3 3 h-27 z" fill="${f}" ${ln}/>`
      :k==='beanie'?`<path d="M53 28 Q53 4 70 4 Q87 4 87 28 Z" fill="${f}" ${ln}/><rect x="52" y="21" width="36" height="8" rx="3" fill="${f}" ${ln}/><path d="M52 25h36" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>`
      :`<path d="M55 24 Q55 8 70 8 Q85 8 85 24 Z" fill="${f}" ${ln}/><path d="M44 26 q26 -7 52 0 q-3 9 -26 9 q-23 0 -26 -9z" fill="${f}" ${ln}/>`);
  }
  return o+'</svg>';
}

/* ----- the picker ----- */
function cwInit(w,sex){ cw=cwClone(w); cwSex=sex==='F'?'F':'M'; cwOpen=['upper','lower','shoes'].find(s=>!wearDone(s,cw[s]))||'upper'; }
let cwN=0;
function cwDraw(){
  const box=$('#f_wearbox'); if(!box) return;
  const rows=WEAR_SLOTS.map(([s,label])=>{
    const it=cw[s];
    if(!it&&WEAR_OPTIONAL[s]) return `<button type="button" class="wrow add" data-act="c_add" data-v="${s}">${ico('plus')} ${WEAR_OPTIONAL[s]}</button>`;
    const d=wearItem(s,it), c=d&&WEAR_COL[it.c], ok=wearDone(s,it);
    const dot=c?(it.c==='multi'?'class="dot cs multi"':it.c==='camo'?'class="dot cs camo"':`class="dot" style="background:${c.h}"`):'class="dot"';
    return `<button type="button" class="wrow ${cwOpen===s?'on':''}" data-act="c_slot" data-v="${s}"><span ${dot}></span>
      <span><b>${label}</b><small class="${ok?'':'need'}">${ok?esc(wearItemText(s,it)):d?'Choose a colour':'Choose'}</small></span>${ico(cwOpen===s?'chev-l':'chev-r','r')}</button>${cwOpen===s?cwPanel(s):''}`;
  }).join('');
  box.innerHTML=`<div class="figcol">${figureSVG(cw,cwSex,'f'+(++cwN),cwOpen)}<div class="figsex"><button type="button" class="${cwSex==='M'?'on':''}" data-act="c_sex" data-v="M">Male</button><button type="button" class="${cwSex==='F'?'on':''}" data-act="c_sex" data-v="F">Female</button></div></div><div class="wlist">${rows}</div>`;
}
function cwPanel(s){
  const it=cw[s]||{}, d=wearItem(s,it);
  const types=WEAR_ITEMS[s].map(x=>`<button type="button" class="opt ${it.t===x.k?'sel':''}" data-act="c_type" data-v="${x.k}">${x.l}</button>`).join('');
  let col='';
  if(d&&!d.nc){
    col=Object.entries(WEAR_COLOURS).map(([g,l])=>`<div class="cgrp">${g}</div><div class="cgrid">${l.map(c=>
      `<button type="button" class="cs ${c[0]==='multi'?'multi':c[0]==='camo'?'camo':''} ${it.c===c[0]?'sel':''}" style="${/multi|camo/.test(c[0])?'':'background:'+c[2]}" data-act="c_col" data-v="${c[0]}" aria-label="${c[1]}" title="${c[1]}"></button>`).join('')}</div>`).join('');
    const pd=/multi|camo/.test(it.c||'')?'disabled':'';
    col+=`<div class="wpat"><b style="font-size:13px">Pattern</b>
      <label class="chk"><input type="checkbox" data-act="c_pat" data-v="striped" ${it.p==='striped'?'checked':''} ${pd}> Striped</label>
      <label class="chk"><input type="checkbox" data-act="c_pat" data-v="dotted" ${it.p==='dotted'?'checked':''} ${pd}> Dotted</label></div>`;
  }
  const nxt=WEAR_SLOTS.map(x=>x[0]).find(k=>(['upper','lower','shoes'].includes(k)||cw[k])&&!wearDone(k,cw[k])&&k!==s);
  return `<div class="wpanel"><div class="opts">${types}</div>${col}
    <div class="wname">${wearDone(s,it)?esc(wearItemText(s,it)):''}</div>
    <div class="wact">${WEAR_OPTIONAL[s]?`<button type="button" class="btn small danger" data-act="c_rm" data-v="${s}">Remove</button>`:'<span></span>'}
      ${nxt?`<button type="button" class="btn small primary" data-act="c_next" data-v="${nxt}">Next: ${WEAR_SLOTS.find(x=>x[0]===nxt)[1]}</button>`:`<button type="button" class="btn small" data-act="c_next" data-v="">Done</button>`}</div></div>`;
}
Object.assign(ACTIONS,{
  c_slot(v,id,el){ cwOpen=(cwOpen===v&&el.classList.contains('wrow'))?'':v; cwDraw(); },   // tap an open row again to close it; tapping the figure always opens
  c_add(v){ cw[v]={t:'',c:'',p:''}; cwOpen=v; cwDraw(); },
  c_rm(v){ delete cw[v]; cwOpen=''; cwDraw(); },
  c_sex(v){ cwSex=v; cwDraw(); },
  c_next(v){ cwOpen=v||''; cwDraw(); },
  c_type(v){ const it=cw[cwOpen]||(cw[cwOpen]={t:'',c:'',p:''}); it.t=v; if(wearItem(cwOpen,it).nc){ it.c=''; it.p=''; } cwDraw(); },
  c_col(v){ const it=cw[cwOpen]; if(!it) return; it.c=v; if(/multi|camo/.test(v)) it.p=''; cwDraw(); },
  c_pat(v){ const it=cw[cwOpen]; if(!it) return; it.p=it.p===v?'':v; cwDraw(); }          // tick again to clear; striped and dotted are exclusive
});

/* ============================================================
   HOME – four boxes: Handover, Diary, Leave, Allocation. Each shows one live line.
============================================================ */
function viewHome(){
  const occ=occAll(), today=todayStr(), tomorrow=dateAdd(today,1);
  // Leave: out / overdue / lighter flags
  let out=0,over=0,lt=0; occ.forEach(r=>{ const s=lvStatus(r.id); if(s!=='in'){ out++; if(s==='overdue') over++; } if(lvLighterDue(r.id).length) lt++; });
  const leaveSub = !occ.length ? 'No patients set up'
    : `<b>${out}</b> out${over?` · <span class="rd">${over} overdue</span>`:''}${lt?` · <span class="rd">${lt} lighter</span>`:''}`;
  // Diary: open items today, and a nudge when tomorrow has people on a request that is not submitted
  const open=dyOpenOn(today);
  const unsub=DAILY_TASKS.filter(t=>dyReqPeople(tomorrow,t.key).length&&!dyReqDone(tomorrow,t.key)).length;
  const diarySub = `<b>${open}</b> to do today${unsub?` · <span class="rd">${unsub} request${unsub>1?'s':''} to submit</span>`:''}`;
  const hoSub = `<b>${occ.length}</b> patient${occ.length===1?'':'s'}`;
  // Allocation: how many are on the current sheet, and whether it has been allocated yet
  alS(); const onN=named().filter(p=>p.shift).length, alDone=Object.keys(alS().alloc.grid).length>0;
  const alSub=!onN?`Roster not set – ${SHEETS[db.al.cur].label}`:`<b>${onN}</b> on ${SHEETS[db.al.cur].label.toLowerCase()}${alDone?'':' · <span class="rd">not allocated</span>'}`;
  // Each tile: accent colour, icon, title, one big live number with its label, and an optional note line
  const tile=(key,icon,title,big,label,note)=>`<button class="tile t-${key}" data-act="go" data-v="${key}">
      <span class="thead"><span class="ticon">${ico(icon)}</span><span class="tgo">${ico('chev-r')}</span></span>
      <h2>${title}</h2>
      <div class="tbig"><b>${big}</b><span>${label}</span></div>
      <div class="tnote">${note||'&nbsp;'}</div></button>`;
  const hr=new Date().getHours(), greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const leaveNote=[over?`<span class="rd">${over} overdue</span>`:'',lt?`<span class="rd">${lt} lighter</span>`:''].filter(Boolean).join(' · ');
  const alNote=!onN?'Roster not set':(alDone?'':'<span class="rd">Not allocated</span>');
  return `<div class="homewrap"><div class="homehead"><div class="hgreet">${greet}</div><h1>${esc(db.settings.wardName||'Ward')}</h1><div class="hdate">${esc(fmtDate(today))}</div></div>
    <div class="tiles">
      ${tile('handover','clipboard','Handover',occ.length,occ.length===1?'patient':'patients','')}
      ${tile('diary','calendar','Diary',open,'to do today',unsub?`<span class="rd">${unsub} request${unsub>1?'s':''} to submit</span>`:'')}
      ${tile('leave','door','Leave',occ.length?out:'–',occ.length?'out on leave':'no patients set up',leaveNote)}
      ${tile('alloc','users','Allocation',onN||'–',onN?'on '+SHEETS[db.al.cur].label.toLowerCase():SHEETS[db.al.cur].label+' sheet',alNote)}
    </div>
    <div class="homefoot"><button class="btn ghost" data-act="goSetup">${ico('gear')} Setup ${ico('lock')}</button></div></div>`;
}

/* ============================================================
   LEAVE – fireboard, sign out / in, lighter + vape pod, roll call, daily export.
   (Who gets which leave is set up ONCE in Setup, together with the patient.)
============================================================ */
// ----- Leave helpers -----
const lvDue   = e => e.due ? dtOf(e.date,e.due,e.timeOut) : null;
const lvBack  = e => e.backTime ? dtOf(e.date,e.backTime,e.timeOut) : null;
const lvOverdue = e => { if(e.backTime) return false; const d=lvDue(e); return !!d && new Date()>d; };
// Current open (not yet signed back in) entry – any date, so it survives midnight
const lvOpen  = id => db.entries.filter(e=>e.room===id && !e.backTime).sort((a,b)=>a.created<b.created?1:-1)[0];
const lvLast  = id => db.entries.filter(e=>e.room===id).sort((a,b)=>a.created<b.created?1:-1)[0];
const lvUsed  = (id,type,date) => db.entries.filter(e=>e.room===id && e.date===date && e.type===type).length;
// Lighters taken out and signed back in WITHOUT being marked returned (stay flagged until resolved)
const lvLighterDue = id => db.entries.filter(e=>e.room===id && e.lighter && e.backTime && !e.lighterBack);
const lvPod   = id => db.pods.find(p=>p.room===id && p.date===todayStr());
// Board status of a room: vacant | in | out | overdue
function lvStatus(id){ const r=roomById(id); if(!isOcc(r)) return 'vacant'; const o=lvOpen(id); if(!o) return 'in'; return lvOverdue(o)?'overdue':'out'; }
// "due in 12m" / "8m overdue"
function lvCountdown(o){
  const d=lvDue(o); if(!d) return o.type==='home'?'Home leave':'';
  const m=Math.round((d-new Date())/60000), f=x=>x>=60?Math.floor(x/60)+'h '+pad(x%60)+'m':x+'m';
  return m>=0 ? 'due in '+f(m) : f(-m)+' overdue';
}
// "Left: 15m ×6 · 30m ×2" for the card
function lvLeftLine(id){
  const r=roomById(id); if(r.noLeave) return '';
  const parts=permTypes(r).map(t=>({t,left:r.allow[t.key]-lvUsed(id,t.key,todayStr())}));
  if(!parts.length || !permEsc(r).length) return '<div class="left none">No leave set up</div>';
  const av=parts.filter(p=>p.left>0);
  if(!av.length) return '<div class="left none">No leave left today</div>';
  return '<div class="left">Left: '+av.map(p=>p.t.short+' ×'+p.left).join(' · ')+'</div>';
}
// Vape pod: a simple switch. Switching ON just records it; switching OFF needs the PIN.
const lvPodRow = id => { const p=lvPod(id); return `<button class="podrow ${p?'on':''}" data-act="l_pod" data-room="${id}" aria-pressed="${p?'true':'false'}"><span>Vape pod${p?' · issued '+p.time:''}</span><span class="swv ${p?'on':''}"></span></button>`; };

// ----- Router for the Leave section -----
function lvView(){
  const nav=subnav([['Fireboard','l_go','board',lv.view==='board'||lv.view==='room'],['Export','l_exportTab','export',lv.view==='export',true]]);
  let out=0,over=0; occAll().forEach(r=>{ const s=lvStatus(r.id); if(s!=='in'){ out++; if(s==='overdue') over++; } });
  const head=lv.view==='board'?pageHead('door','Leave board',occAll().length?`<b>${out}</b> out${over?` · <span class="rd">${over} overdue</span>`:''} · ${esc(fmtDate(todayStr()))}`:esc(fmtDate(todayStr()))):'';
  return nav+head+(lv.view==='room'?lvRoom(lv.room):lv.view==='export'?lvExport():lvBoard());
}

/* ----- FIREBOARD ----- */
function lvCard(id){
  const r=roomById(id), s=lvStatus(id), o=lvOpen(id), lt=lvLighterDue(id);
  const head=`<div class="ctop"><span class="code">${esc(r.label)}</span><span class="status">${{vacant:'Vacant',in:'In',out:'Out',overdue:'Overdue'}[s]}</span></div>`;
  // Vacant rooms: tap to go straight to the setup form for that room
  if(s==='vacant') return `<div class="card vacant" data-act="l_setupRoom" data-room="${id}">${head}<div class="hint">Tap to set up</div></div>`;
  let body='', btn='';
  if(o){
    body=`<div class="detail"><span class="big">${esc(lvCountdown(o))}</span><br>Out ${o.timeOut}${o.date!==todayStr()?' ('+esc(o.date)+')':''} · due ${o.due||'—'}<br>${esc(o.location)} · ${esc(escLabel(o.escort))}${o.escortName?' ('+esc(o.escortName)+')':''}${o.lighter?'<br><span class="warn">Lighter with patient</span>':''}</div>`;
    btn=`<button class="btn primary" data-act="l_signin" data-id="${o.id}">Sign in</button>`;
  } else {
    body=`<div class="detail">On the ward</div>${lvLeftLine(id)}`;
    if(r.noLeave) btn='<span class="nlbtn">No leave</span>';                                                                    // not a button: tapping the card opens the room
    else if(!permTypes(r).length||!permEsc(r).length) btn=`<button class="btn" data-act="l_setupRoom" data-room="${id}">Set up leave</button>`;   // goes to Setup for this room
    else btn=`<button class="btn" data-act="l_signout" data-room="${id}">Sign out</button>`;
  }
  const lighterBtn=(lt.length&&!o)?`<button class="btn small danger" data-act="l_lighterOpen" data-room="${id}">Lighter returned</button>`:'';
  return `<div class="card ${s}" data-act="l_room" data-room="${id}">${head}<div class="pname">${esc(dispName(r.name))}</div>
    ${r.noLeave?'<div class="nlb">NO LEAVE</div>':''}${lt.length?`<div class="ltbar">${ico('alert')} Lighter not returned</div>`:''}${body}<div class="cb">${btn}${lighterBtn}</div>${lvPodRow(id)}</div>`;
}
function lvBoard(){
  const occ=allIds().filter(id=>isOcc(roomById(id)));
  if(!occ.length) return `<div class="panel" style="text-align:center;padding:40px 20px"><h2>No patients yet</h2><button class="btn primary" data-act="goSetup">Open Setup ${ico('lock')}</button></div>`;
  const cnt={in:0,out:0,overdue:0,nl:0};
  occ.forEach(id=>{ const s=lvStatus(id); if(s==='in')cnt.in++; else{cnt.out++; if(s==='overdue')cnt.overdue++;} if(roomById(id).noLeave)cnt.nl++; });
  const ltRooms=occ.filter(id=>lvLighterDue(id).length);
  const f=lv.filter;
  const show=id=>{ const s=lvStatus(id); return f==='all'||(s!=='vacant'&&((f==='in'&&s==='in')||(f==='out'&&(s==='out'||s==='overdue'))||(f==='overdue'&&s==='overdue')||(f==='nl'&&roomById(id).noLeave)||(f==='lt'&&lvLighterDue(id).length))); };
  const seg=(k,l,n,x)=>`<button class="seg ${x||''} ${f===k?'on':''}" data-act="l_filter" data-v="${k}">${l}${n==null?'':' <b>'+n+'</b>'}</button>`;
  const wing=(sex,t)=>{ const list=roomsOf(sex).filter(show); return list.length?`<div class="wing">${t}</div><div class="grid">${list.map(lvCard).join('')}</div>`:''; };
  const body=wing('M','Male')+wing('F','Female');
  const alertBar=ltRooms.length?`<div class="alertbar">${ico('alert')}<b>Lighter not returned</b><span class="alist">${ltRooms.map(id=>`<button class="btn small" data-act="l_room" data-room="${id}">${esc(roomLabel(id))}</button>`).join('')}</span></div>`:'';
  return `${alertBar}<div class="bar"><div class="segs">${seg('all','All',null)}${seg('in','In',cnt.in)}${seg('out','Out',cnt.out)}${cnt.overdue?seg('overdue','Overdue',cnt.overdue,'s-over'):''}${ltRooms.length?seg('lt','Lighter',ltRooms.length,'s-over'):''}${cnt.nl?seg('nl','No leave',cnt.nl,'s-nl'):''}</div>
    <button class="btn danger" style="margin-left:auto" data-act="l_rollcall">${ico('roll')} Fire roll call</button></div>
    ${body||'<p class="muted" style="text-align:center;padding:30px">Nobody matches this filter.</p>'}`;
}

/* ----- ROOM page: allowance, pod, today's log ----- */
const LV_HEAD='<tr><th>Leave</th><th>Escort</th><th>Location</th><th>Wearing</th><th>Out</th><th>Due</th><th>Lighter</th><th>Out by</th><th>Back</th><th>Lighter back</th><th>In by</th>';
function lvRow(e,editable){
  const late=e.backTime && e.due && lvBack(e)>lvDue(e);
  return `<tr class="${!e.backTime?'openrow':''}"><td>${esc(typeLabel(e.type))}</td>
    <td>${esc(escLabel(e.escort))}${e.escortName?'<br><small>'+esc(e.escortName)+'</small>':''}</td>
    <td>${esc(e.location)}</td><td>${esc(e.clothing)}</td><td>${e.timeOut}</td><td>${e.due||'—'}</td>
    <td class="c">${yn(e.lighter)}</td><td>${esc(e.outBy)}</td>
    <td class="${late?'late':''}">${e.backTime?e.backTime+(late?' (late)':''):'<b>OUT</b>'}</td>
    <td class="c ${e.lighter&&e.backTime&&!e.lighterBack?'late':''}">${e.lighter?(e.backTime&&!e.lighterBack?'Not returned':yn(e.lighterBack)):''}</td><td>${esc(e.inBy)}</td>
    ${editable?`<td class="noprint"><button class="btn small" data-act="l_edit" data-id="${e.id}">Edit</button></td>`:''}</tr>`;
}
function lvRoom(id){
  const r=roomById(id); if(!r) return lvBoard();
  const o=lvOpen(id), today=todayStr(), ids=allIds(), i=ids.indexOf(id), s=lvStatus(id), lt=lvLighterDue(id);
  let list=db.entries.filter(e=>e.room===id&&e.date===today);
  if(o&&!list.includes(o)) list.push(o);
  list.sort((a,b)=>(a.date+a.timeOut)<(b.date+b.timeOut)?-1:1);
  const pt=permTypes(r);
  const chips=pt.map(t=>{
    const u=lvUsed(id,t.key,today), cap=r.allow[t.key], dots=cap<=12?Array.from({length:cap},(_,k)=>`<i class="${k<u?'u':''}"></i>`).join(''):'';
    return `<div class="achip ${u>=cap?'full':''}"><b>${t.label}</b><span class="dots2">${dots}</span> <span class="muted">${Math.max(cap-u,0)} left (${u}/${cap})</span></div>`;
  }).join('');
  const escs=permEsc(r).map(l=>l.label).join(', ');
  let action='';
  if(!isOcc(r)) action=`<button class="btn" data-act="l_setupRoom" data-room="${id}">Set up room</button>`;
  else if(o) action=`<button class="btn primary" data-act="l_signin" data-id="${o.id}">Sign in</button>`;
  else if(r.noLeave) action='<span class="nlbtn" style="flex:none;padding:10px 24px">No leave</span>';
  else if(!pt.length||!permEsc(r).length) action=`<button class="btn" data-act="l_setupRoom" data-room="${id}">Set up leave</button>`;
  else action=`<button class="btn primary" data-act="l_signout" data-room="${id}">Sign out</button>`;
  const ltBar=lt.length?`<div class="alertbar">${ico('alert')}<b>Lighter not returned</b><span style="color:inherit">${lt.map(e=>esc(e.date)+' '+e.timeOut).join(', ')}</span><span class="alist" style="margin-left:auto"><button class="btn small primary" data-act="l_lighterOpen" data-room="${id}">Mark returned</button></span></div>`:'';
  return `<div class="topnav"><button class="btn ghost" data-act="l_go" data-v="board">${ico('arrow-l')} Fireboard</button>
      <button class="btn ghost" ${i>0?`data-act="l_room" data-room="${ids[i-1]}"`:'disabled'}>${ico('chev-l')} ${i>0?esc(roomLabel(ids[i-1])):''}</button>
      <button class="btn ghost" ${i<ids.length-1?`data-act="l_room" data-room="${ids[i+1]}"`:'disabled'}>${i<ids.length-1?esc(roomLabel(ids[i+1])):''} ${ico('chev-r')}</button></div>
    ${ltBar}
    <div class="panel"><div class="hero"><div><h2>${esc(r.label)} — ${esc(r.name||'Vacant')}</h2>
      <div class="muted">${r.noLeave?'':'Permitted: '+esc(escs||'none set')}${r.s17?(r.noLeave?'':' · ')+'S17: '+esc(r.s17):''}</div></div>
      <div style="display:flex;gap:10px;align-items:center">${o?`<span class="big ${s==='overdue'?'late':''}">${esc(lvCountdown(o))}</span>`:''}${action}</div></div>
      ${r.noLeave?'<div class="nlb" style="margin-top:12px">NO LEAVE</div>':''}</div>
    ${isOcc(r)?`<div class="panel" style="padding:4px 16px">${lvPodRow(id)}</div>`:''}
    ${chips?`<h3>Today's allowance</h3><div class="achips">${chips}</div>`:''}
    <h3>Today's log</h3>
    <div class="tablewrap"><table>${LV_HEAD}<th class="noprint"></th></tr>
      ${list.map(e=>lvRow(e,true)).join('')||'<tr><td colspan="12" class="muted">No leave recorded today.</td></tr>'}</table></div>`;
}

/* ----- EXPORT (PIN): per-room visual for any date; report / CSV / print ----- */
function lvExportCards(d){
  const ids=allIds(); db.entries.filter(e=>e.date===d&&!roomById(e.room)).forEach(e=>{ if(!ids.includes(e.room)) ids.push(e.room); });   // records of removed beds still export
  return ids.map(id=>{
    const list=db.entries.filter(e=>e.room===id&&e.date===d).sort((a,b)=>a.timeOut<b.timeOut?-1:1);
    const pods=db.pods.filter(p=>p.room===id&&p.date===d), r=roomById(id);
    const lbl=r?r.label:((list[0]||pods[0]||{}).lbl||'Bed');
    if(!list.length&&!pods.length) return `<div class="rcard none"><b>${esc(lbl)}</b>${d===todayStr()&&r&&isOcc(r)?' — '+esc(r.name):''} — no leave recorded</div>`;
    const names=[...new Set([...list.map(e=>e.name),...pods.map(p=>p.name)])].join(' / ');
    const tally=LEAVE_TYPES.map(t=>{const n=list.filter(e=>e.type===t.key).length; return n?`${t.label} ×${n}`:'';}).filter(Boolean).join(' · ');
    return `<div class="rcard"><h3>${esc(lbl)} — ${esc(names)}</h3>
      <div class="muted" style="margin-bottom:6px">${tally?'Totals: '+tally:''}${pods.length?(tally?' · ':'')+'Vape pod issued '+pods.map(p=>p.time).join(', '):''}</div>
      ${list.length?`<div class="tablewrap"><table>${LV_HEAD}</tr>${list.map(e=>lvRow(e,false)).join('')}</table></div>`:''}</div>`;
  }).join('');
}
const LV_REPORT_CSS='body{font:12px/1.4 Arial,Helvetica,sans-serif;color:#111;margin:16px}h1{font-size:18px;margin:0 0 2px}h3{margin:0 0 3px;font-size:14px}.muted{color:#555}'
  +'.rcard{border:1px solid #888;border-radius:4px;padding:8px 10px;margin:0 0 10px;break-inside:avoid}.rcard.none{border:0;padding:2px 0;color:#666}'
  +'table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top;font-size:11px}th{background:#eee;text-transform:uppercase;font-size:10px}'
  +'.late{color:#b00;font-weight:bold}tr.openrow{background:#fff3d6}.c{text-align:center}@page{size:A4 landscape;margin:10mm}';
function lvReportHTML(d){

function lvExport(){
  const d=lv.exportDate;
  return `<div class="noprint">${pageHead('door','Leave export','')}
      <div class="row2"><div><label class="fl">Date</label><input type="date" id="lvExpDate" value="${d}"></div>
      <div class="btnrow"><button class="btn primary" data-act="l_report">${ico('share')} Save report</button><button class="btn" data-act="l_csv">${ico('download')} Save CSV</button><button class="btn" data-act="l_print">${ico('print')} Print</button></div></div>
      </div>
    <div class="printhead"><h2>${esc(db.settings.wardName||'Ward')} – Leave record – ${d}</h2><div>Printed ${new Date().toLocaleString('en-GB')} – CONFIDENTIAL: patient identifiable</div></div>
    ${lvExportCards(d)}`;

/* ----- FIRE ROLL CALL: tap each patient as accounted for (not saved – it's for emergencies) ----- */
let rollOn={};
function lvRollCall(){
  rollOn={};
  const occ=allIds().filter(id=>isOcc(roomById(id))), outs=occ.filter(id=>lvOpen(id)), ins=occ.filter(id=>!lvOpen(id));
  const row=id=>{ const r=roomById(id), o=lvOpen(id);
    return `<button class="rrow ${o?'isout':''}" data-act="l_rollTick" data-room="${id}"><span class="rk">${ico('check')}</span><span><b>${esc(r.label)}</b> ${esc(r.name)}${o?`<small>OUT since ${o.timeOut} · ${esc(o.location)} · ${esc(escLabel(o.escort))}${o.escortName?' ('+esc(o.escortName)+')':''} · wearing ${esc(o.clothing)} · due ${o.due||'—'}</small>`:''}</span></button>`; };
  showModal(sheet('Fire roll call',
    `<div id="rollCount" class="rollcount"></div>${outs.length?'<div class="wing">Signed out</div>'+outs.map(row).join(''):''}<div class="wing">On the ward</div>${ins.map(row).join('')||'<p class="muted">None</p>'}`,
    `<button class="btn ghost" data-act="l_rollReset">Reset</button><button class="btn primary" data-act="closeModal">Close</button>`,'wide'));
  lvRollCount();
}
function lvRollCount(){
  const n=allIds().filter(id=>isOcc(roomById(id))).length, k=Object.values(rollOn).filter(Boolean).length, el=$('#rollCount');
  el.textContent='Accounted for: '+k+' / '+n; el.classList.toggle('done',n>0&&k===n);
}

/* ----- SIGN-OUT form (id given = edit an existing entry, which also shows the return fields) ----- */
let dueTouched=false, fs={room:'',type:'',esc:''};
function lvFormOut(code,id){
  const r=roomById(code), ex=id?db.entries.find(e=>e.id===id):null, date=ex?ex.date:todayStr();
  const e=ex||{type:'',escort:'',escortName:'',location:'',clothing:'',wear:null,timeOut:nowHHMM(),due:'',lighter:false,outBy:'',lighterBack:false,backTime:'',inBy:''};
  const types=LEAVE_TYPES.filter(t=>permTypes(r).includes(t)||(ex&&ex.type===t.key));
  const escs=ESCORT_LEVELS.filter(l=>permEsc(r).includes(l)||(ex&&ex.escort===l.key));
  fs={room:code,type:e.type,esc:e.escort};
  cwInit(e.wear,r.sex);                                  // clothing picker state (starts empty for a new sign-out)
  if(!ex&&escs.length===1) fs.esc=escs[0].key;          // only one option? pre-select it
  dueTouched=!!ex;
  const needsName=(ESCORT_LEVELS.find(l=>l.key===fs.esc)||{}).needsName;
  const last=!ex?lvLast(code):null;
  const typeChips=types.map(t=>{
    const u=lvUsed(code,t.key,date), cap=r.allow[t.key]||0, dis=u>=cap&&!(ex&&ex.type===t.key);
    return `<button type="button" class="opt ${fs.type===t.key?'sel':''}" data-act="l_pickType" data-v="${t.key}" ${dis?'disabled':''}>${t.label}<small>${dis?'none left':u+'/'+cap+' used'}</small></button>`;
  }).join('');
  const escChips=escs.map(l=>`<button type="button" class="opt ${fs.esc===l.key?'sel':''}" data-act="l_pickEsc" data-v="${l.key}">${l.label}</button>`).join('');
  const body=`
    ${last?`<button type="button" class="btn repeat" data-act="l_repeat">${ico('repeat')} Same as last: ${esc(last.location)} · ${esc(last.clothing)}</button>`:''}
    <label class="fl">Leave type</label><div class="opts" id="f_typewrap">${typeChips}</div>
    <label class="fl">Escort level</label><div class="opts" id="f_escwrap">${escChips}</div>
    <div id="f_escnamebox" style="display:${needsName?'block':'none'}"><label class="fl">Name of staff escorting / accompanying</label>
      <input type="text" id="f_escname" value="${esc(e.escortName)}" autocomplete="off" autocapitalize="words"></div>
    <label class="fl">Location / activity</label>
    <input type="text" id="f_loc" value="${esc(e.location)}" autocomplete="off">
    <div class="qrow">${QUICK_LOCATIONS.map(l=>`<button type="button" class="btn" data-act="l_loc" data-v="${l}">${l}</button>`).join('')}</div>
    <label class="fl">What are they wearing?</label>
    <div id="f_wearbox" class="wearbox"></div>
    <div class="row2"><div><label class="fl">Time leaving</label><input type="time" id="f_out" value="${e.timeOut}">
        <div class="stepper"><button type="button" class="btn" data-act="l_nowOut">Now</button></div></div>
      <div><label class="fl">Due back <span style="font-weight:500">(auto)</span></label><input type="time" id="f_due" value="${e.due}">
        <div class="stepper"><button type="button" class="btn" data-act="l_adjDue" data-v="-5">−5</button><button type="button" class="btn" data-act="l_adjDue" data-v="5">+5</button><button type="button" class="btn" data-act="l_adjDue" data-v="15">+15</button></div></div></div>
    <div class="swrow" style="margin-top:12px"><b>Lighter taken with them</b><input type="checkbox" class="sw" id="f_lighter" ${e.lighter?'checked':''}></div>
    <label class="fl">Signed out by (initials)</label>
    <input type="text" id="f_outby" value="${esc(e.outBy)}" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:170px">
    ${ex?`<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><b>Return details</b>
      <div class="swrow"><span>Lighter returned</span><input type="checkbox" class="sw" id="f_lback" ${e.lighterBack?'checked':''}></div>
      <label class="fl">Time returned (blank = still out)</label><input type="time" id="f_back" value="${e.backTime}">
      <label class="fl">Signed in by (initials)</label>
      <input type="text" id="f_inby" value="${esc(e.inBy)}" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:170px">`:''}
    <div class="err" id="formErr"></div>`;
  const foot=`${ex?`<button class="btn danger" data-act="l_delEntry" data-id="${ex.id}">Delete ${ico('lock')}</button>`:''}
    <button class="btn ghost" data-act="closeModal">Cancel</button>
    <button class="btn primary" data-act="l_saveOut" data-room="${code}" data-id="${ex?ex.id:''}">${ex?'Save changes':'Sign out'}</button>`;
  showModal(sheet((ex?'Edit entry':'Sign out')+' — '+esc(r.label)+' '+esc(r.name),body,foot));
  cwDraw();
}
// Auto-complete "due back" from leave type + leaving time (home leave is left blank)
function lvAutoDue(force){
  const t=LEAVE_TYPES.find(x=>x.key===fs.type), out=$('#f_out').value;
  if(!t||!out) return;
  if(t.mins==null){ if(force||!dueTouched) $('#f_due').value=''; return; }
  if(force||!dueTouched){ $('#f_due').value=addMins(out,t.mins); if(force) dueTouched=false; }
}
function lvSelect(wrapId,act,v){ document.querySelectorAll('#'+wrapId+' [data-act="'+act+'"]').forEach(b=>b.classList.toggle('sel',b.dataset.v===v)); }
function lvSetEsc(v){ fs.esc=v; lvSelect('f_escwrap','l_pickEsc',v); const l=ESCORT_LEVELS.find(x=>x.key===v); $('#f_escnamebox').style.display=(l&&l.needsName)?'block':'none'; }
function lvSaveOut(code,id){
  const val=i=>{const el=$('#'+i); return el?el.value:'';};
  const lvl=ESCORT_LEVELS.find(l=>l.key===fs.esc);
  if(!fs.type) return fail('Choose a leave type.','f_typewrap');
  if(!fs.esc)  return fail('Choose an escort level.','f_escwrap');
  if(lvl.needsName && !val('f_escname').trim()) return fail('Enter the name of the escorting / accompanying staff.','f_escname');
  if(!val('f_loc').trim())  return fail('Enter the location / activity.','f_loc');
  const miss=wearMissing(cw); if(miss.length) return fail('Finish clothing: '+miss.join(', ')+'.','f_wearbox');
  if(!val('f_out')) return fail('Enter the time leaving.','f_out');
  if(fs.type!=='home' && !val('f_due')) return fail('Enter the due back time.','f_due');
  if(!val('f_outby').trim()) return fail('Enter your initials.','f_outby');
  const vals={type:fs.type,escort:fs.esc,escortName:lvl.needsName?val('f_escname').trim():'',location:val('f_loc').trim(),clothing:wearText(cw),wear:cwClone(cw),
    timeOut:val('f_out'),due:val('f_due'),lighter:$('#f_lighter').checked,outBy:val('f_outby').trim().toUpperCase()};
  const r=roomById(code);
  if(id){
    const e=db.entries.find(x=>x.id===id); Object.assign(e,vals); e.edited=new Date().toISOString();
    if($('#f_back')){ e.lighterBack=$('#f_lback').checked; e.backTime=val('f_back'); e.inBy=val('f_inby').trim().toUpperCase(); }
    audit('Leave entry edited – '+r.label+' '+e.date+' '+e.timeOut);
    save(); closeModal(); render(true); toast('Saved');
  } else {
    if(lvOpen(code)) return fail('This patient is already signed out.','formErr');
    if(lvUsed(code,fs.type,todayStr())>=(r.allow[fs.type]||0)) return fail('No leave of that type left today.','f_typewrap');
    const ne=Object.assign({id:uid(),room:code,lbl:r.label,name:r.name,date:todayStr(),lighterBack:false,backTime:'',inBy:'',created:new Date().toISOString()},vals);
    db.entries.push(ne); save(); closeModal(); render(true);
    toast(r.label+' signed out',()=>{ db.entries=db.entries.filter(x=>x.id!==ne.id); save(); render(true); toast('Sign-out undone'); });
  }
}
/* ----- SIGN-IN (return) form ----- */
function lvFormIn(id){
  const e=db.entries.find(x=>x.id===id); if(!e) return;
  const body=`<div class="tip ${e.wear?'tipfig':''}">${e.wear?figureSVG(e.wear,(roomById(e.room)||{}).sex,'si'):''}<div><b>${esc(typeLabel(e.type))}</b> · ${esc(escLabel(e.escort))}${e.escortName?' ('+esc(e.escortName)+')':''} · ${esc(e.location)}<br>Out ${e.timeOut}, due ${e.due||'—'} · wearing ${esc(e.clothing)}</div></div>
    <label class="fl">Time returned</label><input type="time" id="r_back" value="${nowHHMM()}">
    ${e.lighter?'<div class="swrow" style="margin-top:12px"><b>Lighter returned</b><input type="checkbox" class="sw" id="r_lighter"></div>':''}
    <label class="fl">Signed in by (initials)</label>
    <input type="text" id="r_inby" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:170px">
    <div class="err" id="formErr"></div>`;
  showModal(sheet('Sign in — '+esc(roomLabel(e.room))+' '+esc(e.name),body,`<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="l_saveIn" data-id="${id}">Sign in</button>`,'small'));
  setTimeout(()=>{ const i=$('#r_inby'); if(i) i.focus(); },120);
}
function lvSaveIn(id){
  const e=db.entries.find(x=>x.id===id), back=$('#r_back').value, inby=$('#r_inby').value.trim().toUpperCase();
  if(!back) return fail('Enter the time returned.','r_back');
  if(!inby) return fail('Enter your initials.','r_inby');
  const lb=e.lighter?$('#r_lighter').checked:false;
  const done=()=>{
    e.backTime=back; e.lighterBack=lb; e.inBy=inby; save(); closeModal(); render(true);
    toast(roomLabel(e.room)+' signed in',()=>{ e.backTime='';e.lighterBack=false;e.inBy=''; save(); render(true); toast('Sign-in undone'); });
  };
  // Lighter taken but not ticked as returned: allowed, but the room stays flagged on the fireboard until marked returned
  if(e.lighter&&!lb) ask({title:'Lighter not returned',msg:'The lighter is not ticked as returned. The room stays flagged until it is.',ok:'Sign in anyway'},done,()=>lvFormIn(id));
  else done();
}
/* ----- Mark an outstanding lighter as returned (any staff member, with initials) ----- */
function lvLighterForm(code){
  const l=lvLighterDue(code); if(!l.length) return;
  showModal(sheet('Lighter returned — '+esc(roomLabel(code))+' '+esc(roomById(code).name),
    `<div class="tip">${l.map(e=>esc(e.date)+' · out '+e.timeOut+', back '+e.backTime+' · '+esc(typeLabel(e.type))).join('<br>')}</div>
     <label class="fl">Confirmed by (initials)</label><input type="text" id="l_by" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:170px"><div class="err" id="formErr"></div>`,
    `<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="l_lighterSave" data-room="${code}">Mark returned</button>`,'small'));
  setTimeout(()=>{ const i=$('#l_by'); if(i) i.focus(); },120);
}
function lvLighterSave(code){
  const by=$('#l_by').value.trim().toUpperCase(); if(!by) return fail('Enter your initials.','l_by');
  lvLighterDue(code).forEach(e=>{ e.lighterBack=true; e.lighterBy=by; e.lighterAt=nowHHMM(); });
  save(); closeModal(); render(true); toast('Lighter marked returned');
}

/* ----- Leave actions ----- */
Object.assign(ACTIONS,{
  l_go(v){ go('leave',v); },
  l_exportTab(){ requirePin(()=>go('leave','export')); },                    // exports hold patient data -> PIN
  l_filter(v){ lv.filter=v; render(true); },
  l_room(v,id,el){ go('leave','room',el.dataset.room); },
  // Jump to this room's editor in Setup (PIN first), opened and scrolled into view
  l_setupRoom(v,id,el){ ACTIONS.s_openRoom(el.dataset.room); },
  l_signout(v,id,el){
    const r=roomById(el.dataset.room);
    if(!isOcc(r)||(!r.noLeave&&(!permTypes(r).length||!permEsc(r).length))) return ACTIONS.s_openRoom(r.id);
    if(r.noLeave) return toast('NO LEAVE');
    if(lvOpen(r.id)) return toast('Already signed out');
    lvFormOut(r.id);
  },
  l_signin(v,id){ lvFormIn(id); },
  l_edit(v,id){ const e=db.entries.find(x=>x.id===id); lvFormOut(e.room,id); },
  l_saveOut(v,id,el){ lvSaveOut(el.dataset.room,id); }, l_saveIn(v,id){ lvSaveIn(id); },
  l_pickType(v){ fs.type=v; lvSelect('f_typewrap','l_pickType',v); lvAutoDue(true); },
  l_pickEsc(v){ lvSetEsc(v); const l=ESCORT_LEVELS.find(x=>x.key===fs.esc); if(l&&l.needsName) setTimeout(()=>$('#f_escname').focus(),50); },
  l_loc(v){ $('#f_loc').value=v; },
  l_nowOut(){ $('#f_out').value=nowHHMM(); lvAutoDue(false); },
  l_adjDue(v){ const base=$('#f_due').value||$('#f_out').value||nowHHMM(); $('#f_due').value=addMins(base,parseInt(v,10)); dueTouched=true; },
  l_repeat(){                                   // refill from this patient's last leave (location, clothing, escort, lighter)
    const l=lvLast(fs.room), r=roomById(fs.room); if(!l) return;
    if(permTypes(r).some(t=>t.key===l.type) && lvUsed(fs.room,l.type,todayStr())<(r.allow[l.type]||0)){ fs.type=l.type; lvSelect('f_typewrap','l_pickType',fs.type); }
    if(permEsc(r).some(x=>x.key===l.escort)) lvSetEsc(l.escort);
    $('#f_escname').value=l.escortName; $('#f_loc').value=l.location; cw=cwClone(l.wear); cwDraw(); $('#f_lighter').checked=l.lighter;
    lvAutoDue(true); toast('Filled from last leave');
  },
  l_delEntry(v,id){ requirePin(()=>{
    const e=db.entries.find(x=>x.id===id);
    ask({title:'Delete entry',msg:'Permanently delete this entry?',ok:'Delete',danger:true},
      ()=>{ audit('Leave entry deleted – '+roomLabel(e.room)+' '+e.date+' '+e.timeOut); db.entries=db.entries.filter(x=>x.id!==id); save(); render(true); toast('Deleted'); },
      ()=>lvFormOut(e.room,id)); }); },
  // Vape pod switch: ON records it straight away, OFF needs the PIN
  l_pod(v,id,el){
    const rid=el.dataset.room, r=roomById(rid), p=lvPod(rid);
    if(!p){ db.pods.push({id:uid(),room:rid,lbl:r.label,name:r.name,date:todayStr(),time:nowHHMM()}); save(); render(true); toast('Vape pod issued – '+r.label); }
    else requirePin(()=>ask({title:'Reverse vape pod',msg:'Reverse today\'s vape pod for <b>'+esc(r.label)+'</b>?',ok:'Reverse',danger:true},
      ()=>{ db.pods=db.pods.filter(x=>!(x.room===rid&&x.date===todayStr())); audit('Vape pod reversed – '+r.label); save(); render(true); toast('Pod reversed'); }));
  },
  l_lighterOpen(v,id,el){ lvLighterForm(el.dataset.room); }, l_lighterSave(v,id,el){ lvLighterSave(el.dataset.room); },
  l_rollcall(){ lvRollCall(); },
  l_rollTick(v,id,el){ const k=el.dataset.room; rollOn[k]=!rollOn[k]; el.classList.toggle('done',rollOn[k]); lvRollCount(); },
  l_rollReset(){ rollOn={}; document.querySelectorAll('.rrow').forEach(x=>x.classList.remove('done')); lvRollCount(); },
  l_print(){ try{ window.print(); }catch(e){ toast('Printing is not available here – use Save report'); } },
  l_report(){ saveFile('leave-report-'+lv.exportDate+'.html',lvReportHTML(lv.exportDate),'text/html'); },
  l_csv(){
    const d=lv.exportDate, h=['Date','Room','Patient','Leave','Escort level','Escort name','Location','Wearing','Time out','Due back','Lighter taken','Out by','Lighter returned','Time back','In by'];
    const rows=db.entries.filter(e=>e.date===d).sort((a,b)=>((roomById(a.room)||{label:a.lbl}).label+a.timeOut)<((roomById(b.room)||{label:b.lbl}).label+b.timeOut)?-1:1)
      .map(e=>[e.date,(roomById(e.room)||{label:e.lbl}).label,e.name,typeLabel(e.type),escLabel(e.escort),e.escortName,e.location,e.clothing,e.timeOut,e.due,e.lighter?'Y':'N',e.outBy,e.lighter?(e.lighterBack?'Y':'N'):'',e.backTime,e.inBy]);
    db.pods.filter(p=>p.date===d).forEach(p=>rows.push([p.date,(roomById(p.room)||{label:p.lbl}).label,p.name,'Vape pod issued','','','','',p.time,'','','','','','']));
    saveFile('leave-'+d+'.csv',csvOf([h,...rows]),'text/csv');
  }
});

/* ============================================================
   DIARY – the office diary: visits, escorts, appointments, plus the daily bloods / ECG requests.
   Data: db.diary (entries) and db.requests (people added to tomorrow's bloods / ECG request).
============================================================ */
const dyEntries = d => db.diary.filter(e=>e.date===d).sort((a,b)=>((a.time||'')+a.created)<((b.time||'')+b.created)?-1:1);   // all-day first, then by time
const dyReq       = (target,key) => db.requests[target+'|'+key]||{people:[]};
const dyReqDone   = (target,key) => dyReq(target,key).done;
const dyReqPeople = (target,key) => dyReq(target,key).people||[];
const dyPeopleOn  = d => DAILY_TASKS.flatMap(t=>dyReqPeople(d,t.key).map(p=>({t,p,d})));          // bloods / ECG people due ON day d
// Open items on a day = diary entries not ticked + bloods / ECG people not done (also drives the badge on the date strip)
const dyOpenOn = d => db.diary.filter(e=>e.date===d&&!e.done).length + dyPeopleOn(d).filter(x=>!x.p.done).length;
// Patient names for the Person boxes (type to pick, or type anyone else)
const dyNames = () => '<datalist id="pnames">'+occAll().map(r=>`<option value="${esc(r.name)}"></option>`).join('')+'</datalist>';

function dyView(){
  const nav=subnav([['Day','d_go','day',dy.view==='day'],['Upcoming','d_go','upcoming',dy.view==='upcoming'],['Export','d_exportTab','export',dy.view==='export',true]]);
  return nav+(dy.view==='upcoming'?dyUpcoming():dy.view==='export'?dyExport():dyDay());
}

// One diary line. showDate = prefix the date (used for carried-over lists)
function dyEntryRow(e,showDate){
  return `<div class="erow ${e.done?'done':''}">
    <button class="tick ${e.done?'on':''}" data-act="${e.done?'d_untick':'d_tick'}" data-id="${e.id}" aria-label="${e.done?'Mark not done':'Mark done'}">${ico('check')}</button>
    <div class="etime ${e.time?'':'all'}">${e.time?esc(e.time):'All day'}</div>
    <div class="ebody"><div class="etitle">${esc(e.title)}</div>
      <div class="emeta">${showDate?`<span class="edate">${esc(fmtDate(e.date,true))}</span>`:''}${e.person?`<span>${esc(e.person)}</span>`:''}<span class="tag">${esc(dcat(e.cat).label)}</span></div>
      ${e.notes?`<div class="enotes">${esc(e.notes)}</div>`:''}
      ${e.done?`<div class="edone">Done ${esc(e.doneAt||'')} · ${esc(e.doneBy||'')}</div>`:''}</div>
    <button class="btn small" data-act="d_edit" data-id="${e.id}">Edit</button></div>`;
}
// A bloods / ECG person on the day they are due. Tick = taken / done, with initials.
function dyPersonRow(target,t,p,showDate){
  return `<div class="erow ${p.done?'done':''}">
    <button class="tick ${p.done?'on':''}" data-act="${p.done?'d_puntick':'d_ptick'}" data-v="${target}|${t.key}" data-id="${p.id}" aria-label="${p.done?'Mark not done':'Mark done'}">${ico('check')}</button>
    <div class="etime all">${esc(t.short)}</div>
    <div class="ebody"><div class="etitle">${esc(p.name)}</div>
      ${showDate?`<div class="emeta"><span class="edate">${esc(fmtDate(target,true))}</span></div>`:''}
      ${p.done?`<div class="edone">Done ${esc(p.done.at)} · ${esc(p.done.by)}</div>`:''}</div></div>`;
}
// A daily bloods / ECG request row: "for <target date>", with the people added so far. Tap to open the pop-up.
function dyRequestRow(target,t,lateLabel){
  const done=dyReqDone(target,t.key), people=dyReqPeople(target,t.key), v=target+'|'+t.key;
  return `<div class="erow dtask ${done?'done':''}" data-act="d_req" data-v="${v}" style="cursor:pointer">
    <span class="tick ${done?'on':''}">${ico('check')}</span>
    <div class="ebody"><div class="etitle">${esc(t.label)} for ${esc(fmtDate(target,true))}${lateLabel?` <span class="edate">${lateLabel}</span>`:''}</div>
      <div class="who">${people.length?people.map(p=>`<span>${esc(p.name)}</span>`).join(''):'<span class="none">No one added yet</span>'}</div>
      ${done?`<div class="edone">Submitted ${esc(done.at)} · ${esc(done.by)}</div>`:''}</div>
    <button class="btn small" data-act="d_req" data-v="${v}">${done?'View':'Add people'}</button></div>`;
}

/* ----- DAY view: date strip, carried over, bloods/ECG due today, diary, daily requests for tomorrow ----- */
function dyDay(){
  const d=dy.sel, today=todayStr(), list=dyEntries(d), tomorrow=dateAdd(d,1), due=dyPeopleOn(d);
  const cells=Array.from({length:7},(_,i)=>{ const x=dateAdd(d,i-3), n=dyOpenOn(x), dt=toDate(x);
    return `<button class="dcell ${x===d?'on':''} ${x===today?'today':''}" data-act="d_pickDay" data-v="${x}">${n?`<i class="badge">${n}</i>`:''}${dt.toLocaleDateString('en-GB',{weekday:'short'})}<b>${dt.getDate()}</b>${dt.toLocaleDateString('en-GB',{month:'short'})}</button>`; }).join('');
  // Carried over (today only): anything not ticked from the last 14 days, plus daily requests missed in the last 3 days (only if someone was added)
  let carried='';
  if(d===today){
    const old=db.diary.filter(e=>!e.done&&e.date<today&&e.date>=dateAdd(today,-14)).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
    const oldP=[]; for(let k=14;k>=1;k--){ const day=dateAdd(today,-k); dyPeopleOn(day).forEach(x=>{ if(!x.p.done) oldP.push(dyPersonRow(day,x.t,x.p,true)); }); }
    const missed=[]; for(let k=1;k<=3;k++){ const day=dateAdd(today,-k), target=dateAdd(day,1); DAILY_TASKS.forEach(t=>{ if(!dyReqDone(target,t.key)&&dyReqPeople(target,t.key).length) missed.push(dyRequestRow(target,t,'not submitted')); }); }
    const n=old.length+oldP.length+missed.length;
    if(n) carried=`<div class="panel dlist" style="border-color:var(--red)"><div class="sechead red"><span>Carried over – not ticked</span><span>${n}</span></div>${missed.join('')}${oldP.join('')}${old.map(e=>dyEntryRow(e,true)).join('')}</div>`;
  }
  const total=list.length+due.length, doneN=list.filter(e=>e.done).length+due.filter(x=>x.p.done).length;
  const duePanel=due.length?`<div class="panel dlist"><div class="sechead"><span>Bloods and ECG – due ${d===today?'today':'this day'}</span><span>${due.filter(x=>x.p.done).length} of ${due.length}</span></div>${due.map(x=>dyPersonRow(d,x.t,x.p)).join('')}</div>`:'';
  return pageHead('calendar',esc(fmtDate(d)),`${d===today?'Today · ':''}${total?doneN+' of '+total+' done':'Nothing entered'}`,`<button class="btn" data-act="d_today">Today</button><button class="btn primary" data-act="d_add">${ico('plus')} Add entry</button>`)+`
    <div class="stripnav"><button class="btn ghost" data-act="d_shift" data-v="-7" aria-label="Back a week">${ico('chev-l')}</button><div class="strip" style="flex:1">${cells}</div><button class="btn ghost" data-act="d_shift" data-v="7" aria-label="Forward a week">${ico('chev-r')}</button></div>
    ${carried}${duePanel}
    <div class="panel dlist"><div class="sechead"><span>Diary</span><span>${list.length}</span></div>${list.length?list.map(e=>dyEntryRow(e)).join(''):'<div class="empty">Nothing entered for this day.</div>'}</div>
    <div class="panel dlist"><div class="sechead"><span>Daily requests – for tomorrow</span><span>${esc(fmtDate(tomorrow,true))}</span></div>${DAILY_TASKS.map(t=>dyRequestRow(tomorrow,t)).join('')}</div>`;
}
/* ----- UPCOMING: next 14 days, only days that have entries or bloods / ECG people ----- */
function dyUpcoming(){
  const today=todayStr(); let out='';
  for(let i=0;i<=14;i++){ const x=dateAdd(today,i), l=dyEntries(x), pp=dyPeopleOn(x); if(!l.length&&!pp.length) continue;
    out+=`<div class="daygrp"><span>${esc(fmtDate(x))}${x===today?' (today)':''}</span><button class="btn small" data-act="d_pickDay" data-v="${x}">Open day</button></div><div class="panel dlist">${pp.map(a=>dyPersonRow(x,a.t,a.p)).join('')}${l.map(e=>dyEntryRow(e)).join('')}</div>`; }
  return pageHead('calendar','Upcoming','Next 14 days',`<button class="btn primary" data-act="d_add">${ico('plus')} Add entry</button>`)+`${out||'<div class="panel empty">Nothing planned in the next 14 days.</div>'}`;
}
/* ----- EXPORT (PIN): date range as report / CSV ----- */
function dyExport(){
  return pageHead('calendar','Diary export','')+`<div class="panel">
      <div class="row2"><div><label class="fl">From</label><input type="date" id="dyFrom" value="${dy.from}"></div><div><label class="fl">To</label><input type="date" id="dyTo" value="${dy.to}"></div></div>
      <div class="btnrow" style="margin-top:12px"><button class="btn primary" data-act="d_report">${ico('share')} Save report</button><button class="btn" data-act="d_csv">${ico('download')} Save CSV</button></div></div>`;
}
const DY_REPORT_CSS='body{font:12px/1.4 Arial,Helvetica,sans-serif;color:#111;margin:16px}h1{font-size:18px;margin:0 0 2px}h2{font-size:14px;margin:16px 0 4px;border-bottom:1px solid #888}.muted{color:#555}'
  +'table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top;font-size:11px}th{background:#eee;text-transform:uppercase;font-size:10px}.late{color:#b00;font-weight:bold}@page{size:A4 landscape;margin:10mm}';
function dyReportHTML(from,to){
  let body='';
  for(let x=from;x<=to;x=dateAdd(x,1)){
    const l=dyEntries(x);
    const reqs=DAILY_TASKS.map(t=>{ const p=dyReqPeople(x,t.key), d=dyReqDone(x,t.key); if(!p.length&&!d) return '';
      return esc(t.short)+': '+(p.length?p.map(a=>esc(a.name)+(a.done?' (done '+esc(a.done.at)+' '+esc(a.done.by)+')':' (<span class="late">not done</span>)')).join(', '):'none')+' – '+(d?'request submitted '+esc(d.at)+' ('+esc(d.by)+')':'<span class="late">request not recorded</span>'); }).filter(Boolean).join('<br>');
    if(!l.length&&!reqs) continue;
    body+=`<h2>${esc(fmtDate(x))}</h2>${reqs?`<div class="muted">${reqs}</div>`:''}`+(l.length?`<table><tr><th>Time</th><th>Title</th><th>Person</th><th>Category</th><th>Notes</th><th>Entered by</th><th>Done</th></tr>${l.map(e=>`<tr><td>${esc(e.time||'All day')}</td><td>${esc(e.title)}</td><td>${esc(e.person)}</td><td>${esc(dcat(e.cat).label)}</td><td>${esc(e.notes)}</td><td>${esc(e.by)}</td><td>${e.done?esc(e.doneAt)+' ('+esc(e.doneBy)+')':'<span class="late">Not done</span>'}</td></tr>`).join('')}</table>`:'');
  }
  return '<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diary '+from+' to '+to+'</title><style>'+DY_REPORT_CSS+'</style></head><body>'
    +'<h1>'+esc(db.settings.wardName||'Ward')+' – Diary – '+esc(fmtDate(from,true))+(to!==from?' to '+esc(fmtDate(to,true)):'')+'</h1><div class="muted">Generated '+new Date().toLocaleString('en-GB')+' – CONFIDENTIAL: patient identifiable</div>'+(body||'<p class="muted">No entries in this period.</p>')+'</body></html>';
}

        <div class="stepper"><button type="button" class="btn" data-act="d_clearTime">All day</button></div></div></div>

    <label class="fl">Entered by (initials)</label>

    <button class="btn primary" data-act="d_saveEntry" data-id="${ex?ex.id:''}">${ex?'Save changes':'Add entry'}</button>`;

function dySaveEntry(id){
  const v=i=>$('#'+i).value.trim();
  if(!v('e_title')) return fail('Enter a title.','e_title');
  if(!dcatSel) return fail('Choose a category.','e_catwrap');
  if(dcat(dcatSel).needsPerson&&!v('e_person')) return fail('Enter the person this is for.','e_person');
  if(!v('e_date')) return fail('Choose a date.','e_date');
  if(!v('e_by')) return fail('Enter your initials.','e_by');
  const vals={title:v('e_title'),cat:dcatSel,person:v('e_person'),date:v('e_date'),time:v('e_time'),notes:v('e_notes'),by:v('e_by').toUpperCase()};
  if(id){ const e=db.diary.find(x=>x.id===id); Object.assign(e,vals,{edited:new Date().toISOString()}); audit('Diary entry edited – '+e.date+' '+e.title); }
  else db.diary.push(Object.assign({id:uid(),done:false,created:new Date().toISOString()},vals));
  dy.sel=vals.date; save(); closeModal(); render(true); toast(id?'Saved':'Entry added');
}
/* Tick an entry done: needs initials so every completion is attributable */
function dyTickForm(id){
  const e=db.diary.find(x=>x.id===id); if(!e) return;
  showModal(sheet('Mark done',`<div class="tip"><b>${esc(e.title)}</b>${e.person?' · '+esc(e.person):''}<br>${esc(fmtDate(e.date,true))}${e.time?' · '+esc(e.time):''}</div>
    <label class="fl">Completed by (initials)</label><input type="text" id="t_by" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:170px"><div class="err" id="formErr"></div>`,
    `<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="d_tickSave" data-id="${id}">Mark done</button>`,'small'));
  setTimeout(()=>{ const i=$('#t_by'); if(i) i.focus(); },120);
}
function dyTickSave(id){
  const by=$('#t_by').value.trim().toUpperCase(); if(!by) return fail('Enter your initials.','t_by');
  const e=db.diary.find(x=>x.id===id); e.done=true; e.doneBy=by; e.doneAt=nowHHMM(); save(); closeModal(); render(true); toast('Marked done');
}
/* Tick a bloods / ECG person done (taken) – needs initials. v = "date|taskKey" */
function dyPTickForm(v,id){
  const [target,key]=v.split('|'), t=DAILY_TASKS.find(x=>x.key===key), p=dyReqPeople(target,key).find(x=>x.id===id); if(!p) return;
  showModal(sheet('Mark done',`<div class="tip"><b>${esc(t.short)}</b> · ${esc(p.name)}<br>${esc(fmtDate(target,true))}</div>
    <label class="fl">Completed by (initials)</label><input type="text" id="t_by" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:170px"><div class="err" id="formErr"></div>`,
    `<button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="d_pSave" data-v="${v}" data-id="${id}">Mark done</button>`,'small'));
  setTimeout(()=>{ const i=$('#t_by'); if(i) i.focus(); },120);
}
function dyPSave(v,id){
  const by=$('#t_by').value.trim().toUpperCase(); if(!by) return fail('Enter your initials.','t_by');
  const p=dyReqPeople(...v.split('|')).find(x=>x.id===id); p.done={by,at:nowHHMM()}; save(); closeModal(); render(true); toast('Marked done');
}
/* ---- Daily bloods / ECG request pop-up: add people one after another (saved as you go), then mark submitted with initials.
        People added AFTER submission are flagged so nothing slips through. ---- */
let reqKey='';
function dyReqPopup(v){
  reqKey=v; const [target,key]=v.split('|'), t=DAILY_TASKS.find(x=>x.key===key);
  showModal(sheet(esc(t.short)+' requests',`${dyNames()}<div class="tip">For <b>${esc(fmtDate(target))}</b></div>
    <label class="fl">Add a person</label>
    <div style="display:flex;gap:8px"><input type="text" id="rq_name" list="pnames" autocomplete="off" autocapitalize="words" placeholder="Name" style="flex:1"><button class="btn primary" data-act="d_reqAdd">${ico('plus')} Add</button></div>
    <div id="rq_list"></div><div id="rq_submit"></div><div class="err" id="formErr"></div>`,
    `<button class="btn" data-act="closeModal">Close</button>`));
  dyReqDraw(); setTimeout(()=>{ const i=$('#rq_name'); if(i) i.focus(); },150);
}
// Redraw just the list + submit area (keeps the keyboard open between adds)
function dyReqDraw(){
  const [target,key]=reqKey.split('|'), people=dyReqPeople(target,key), done=dyReqDone(target,key);
  $('#rq_list').innerHTML=people.length
    ? `<h3>${people.length} ${people.length===1?'person':'people'}</h3><div class="panel dlist" style="margin:0">${people.map(p=>`<div class="erow" style="align-items:center;padding:8px 14px"><div class="ebody"><b>${esc(p.name)}</b>${done&&p.t>done.t?' <span class="edate">added after submission</span>':''}</div><button class="btn small ghost" data-act="d_reqRemove" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">${ico('x')}</button></div>`).join('')}</div>`
    : '<p class="muted" style="margin:14px 0 4px">No one added yet.</p>';
  $('#rq_submit').innerHTML=done
    ? `<div class="tip" style="border-left-color:var(--green)"><b>Submitted</b> ${esc(done.at)} · ${esc(done.by)}</div><button class="btn danger small" data-act="d_reqUndo">Undo submission ${ico('lock')}</button>`
    : `<label class="fl">Submitted by (initials)</label><div style="display:flex;gap:8px;align-items:center"><input type="text" id="rq_by" maxlength="5" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;max-width:150px"><button class="btn primary" data-act="d_reqSubmit">Mark submitted</button></div>${people.length?'':'<div class="hint">Submitting with no one added confirms none are needed.</div>'}`;
}
function dyReqAdd(){
  const el=$('#rq_name'), name=el.value.trim(); if(!name){ el.focus(); return; }
  const r=db.requests[reqKey]||(db.requests[reqKey]={people:[]});
  r.people.push({id:uid(),name,t:new Date().toISOString()}); save(); el.value=''; $('#formErr').textContent=''; dyReqDraw(); el.focus(); render();
}
function dyReqSubmit(){
  const by=$('#rq_by').value.trim().toUpperCase(); if(!by) return fail('Enter your initials.','rq_by');
  const r=db.requests[reqKey]||(db.requests[reqKey]={people:[]});
  r.done={by,at:nowHHMM(),t:new Date().toISOString()}; save(); closeModal(); render(true); toast('Marked submitted');
}

Object.assign(ACTIONS,{
  d_go(v){ go('diary',v); },
  d_exportTab(){ requirePin(()=>go('diary','export')); },
  d_pickDay(v){ dy.sel=v; go('diary','day'); },
  d_shift(v){ dy.sel=dateAdd(dy.sel,parseInt(v,10)); render(true); },
  d_today(){ dy.sel=todayStr(); render(true); },
  d_add(){ dyEntryForm(); }, d_edit(v,id){ dyEntryForm(id); },
  d_quick(v){ const q=QUICK_TITLES[+v]; $('#e_title').value=q[0]; dcatSel=q[1]; document.querySelectorAll('#e_catwrap .opt').forEach(b=>b.classList.toggle('sel',b.dataset.v===dcatSel)); },
  d_pickCat(v){ dcatSel=v; document.querySelectorAll('#e_catwrap .opt').forEach(b=>b.classList.toggle('sel',b.dataset.v===dcatSel)); },
  d_clearTime(){ $('#e_time').value=''; },
  d_saveEntry(v,id){ dySaveEntry(id); },
  d_tick(v,id){ dyTickForm(id); }, d_tickSave(v,id){ dyTickSave(id); },
  d_untick(v,id){ const e=db.diary.find(x=>x.id===id), prev={done:e.done,doneBy:e.doneBy,doneAt:e.doneAt};
    e.done=false; delete e.doneBy; delete e.doneAt; save(); render(true); toast('Marked not done',()=>{ Object.assign(e,prev); save(); render(true); }); },
  d_ptick(v,id){ dyPTickForm(v,id); }, d_pSave(v,id){ dyPSave(v,id); },
  d_puntick(v,id){ const p=dyReqPeople(...v.split('|')).find(x=>x.id===id), prev=p.done; delete p.done; save(); render(true); toast('Marked not done',()=>{ p.done=prev; save(); render(true); }); },
  d_req(v){ dyReqPopup(v); },
  d_reqAdd(){ dyReqAdd(); }, d_reqSubmit(){ dyReqSubmit(); },
  d_reqRemove(v,id){ const r=db.requests[reqKey]; if(!r) return; r.people=r.people.filter(p=>p.id!==id); save(); dyReqDraw(); render(); },
  // Undoing a submission needs the PIN (so a sent request can't be quietly reopened)
  d_reqUndo(){ const k=reqKey; requirePin(()=>ask({title:'Undo submission',msg:'Mark this request as NOT submitted?',ok:'Undo',danger:true},()=>{ delete db.requests[k].done; audit('Request submission undone – '+k); save(); render(true); dyReqPopup(k); toast('Marked not submitted'); },()=>dyReqPopup(k))); },
  d_delEntry(v,id){ requirePin(()=>{ const e=db.diary.find(x=>x.id===id);
    ask({title:'Delete entry',msg:'Permanently delete “'+esc(e.title)+'”?',ok:'Delete',danger:true},
      ()=>{ audit('Diary entry deleted – '+e.date+' '+e.title); db.diary=db.diary.filter(x=>x.id!==id); save(); render(true); toast('Deleted'); },
      ()=>dyEntryForm(id)); }); },
  d_report(){ const a=dy.from,b=dy.to<dy.from?dy.from:dy.to; saveFile('diary-'+a+(b!==a?'_to_'+b:'')+'.html',dyReportHTML(a,b),'text/html'); },
  d_csv(){
    const a=dy.from,b=dy.to<dy.from?dy.from:dy.to;
    const h=['Date','Time','Title','Person','Category','Notes','Entered by','Done','Done time','Done by','Request submitted','Submitted time','Submitted by'];
    const rows=db.diary.filter(e=>e.date>=a&&e.date<=b).sort((x,y)=>(x.date+(x.time||''))<(y.date+(y.time||''))?-1:1)
      .map(e=>[e.date,e.time,e.title,e.person,dcat(e.cat).label,e.notes,e.by,e.done?'Y':'N',e.doneAt||'',e.doneBy||'','','','']);
    // bloods / ECG: one row per person, dated for the day they are booked
    Object.keys(db.requests).filter(k=>{const d=k.split('|')[0]; return d>=a&&d<=b;}).forEach(k=>{ const [d,t]=k.split('|'), r=db.requests[k], tk=DAILY_TASKS.find(x=>x.key===t);
      (r.people||[]).forEach(p=>rows.push([d,'',tk?tk.short:t,p.name,tk?tk.short:t,'','',p.done?'Y':'N',p.done?p.done.at:'',p.done?p.done.by:'',!r.done?'N':(p.t>r.done.t?'Added after submission':'Y'),r.done?r.done.at:'',r.done?r.done.by:''])); });
    saveFile('diary-'+a+(b!==a?'_to_'+b:'')+'.csv',csvOf([h,...rows]),'text/csv');
  }
});

/* ============================================================
   HANDOVER – housekeeping + per-patient Early / Late / Night notes + care plan.
   Anyone can READ. Editing needs the PIN (an unlocked session turns the notes into boxes).
   Patient names, sections and observation levels come from Setup.
============================================================ */
function hoView(){
  return subnav([['Handover','go','handover',true],['Present','h_present','',false]])+hoMain();
}
function hoNoteBox(ed,field,note,extra){
  return ed
    ? `<textarea class="auto" data-f="${field}" ${extra} rows="3" placeholder="Nothing to hand over">${esc(note.text)}</textarea>`
    : `<div class="txt">${note.text.trim()?esc(note.text):'<span class="muted">Nothing to hand over</span>'}</div>`;
}
function hoBed(r,ed,exp){            // exp = drawn for the exported document (read only, care plan open)
  if(ed===undefined) ed=isUnlocked();
  const shifts=SHIFTS.map(s=>{ const n=noteOf(r,s.key);
    return `<div class="shift"><div class="shl"><span>${s.label}</span><small id="st_${r.id}_${s.key}">${esc(stamp(n))}</small></div>${hoNoteBox(ed,'h_note',n,`data-room="${r.id}" data-s="${s.key}"`)}</div>`; }).join('');
  const c=noteOf(r,'care');
  const showCare=!exp||db.settings.docCare;
  return `<div class="bed" id="b_${r.id}"><div class="bedhead"><span class="room">${esc(r.label)}</span><span class="nm">${esc(r.name)}</span>${tagsHTML(r)}</div>
    <div class="shifts">${shifts}</div>
    ${showCare?`<details class="care" data-care="${r.id}" ${exp||careOpen.has(r.id)?'open':''}><summary>Care plan ${c.text.trim()?'':'<span class="tag">Empty</span>'}<small class="muted" id="st_${r.id}_care" style="margin-left:auto;font-weight:500">${esc(stamp(c))}</small></summary>
      <div class="in">${hoNoteBox(ed,'h_care',c,`data-room="${r.id}"`)}</div></details>`:''}</div>`;
}
function hoMain(){
  const ed=isUnlocked(), occ=occAll(), hn=db.house;
  const chips=[`<button class="btn" data-act="h_jump" data-v="house">Housekeeping</button>`].concat(occ.map(r=>`<button class="btn" data-act="h_jump" data-v="b_${r.id}">${esc(r.label)}</button>`)).join('');
  // Occupied beds in full; all vacant beds collapse into one line so the page stays short to read
  const wing=(sex,title)=>{ const l=db.rooms.filter(r=>r.sex===sex), o=l.filter(isOcc), vac=l.filter(r=>!isOcc(r));
    return l.length?`<div class="wing">${title} · ${o.length} patient${o.length===1?'':'s'}</div>${o.map(r=>hoBed(r)).join('')}${vac.length?`<div class="bed vac"><b>Vacant</b><span>${vac.map(r=>esc(r.label)).join(', ')}</span></div>`:''}`:''; };
  return pageHead('clipboard','Ward handover',`${occ.length} patient${occ.length===1?'':'s'}${ed?' · editing':''}`,
      `<button class="btn ${ed?'':'primary'}" data-act="h_edit">${ed?ico('lock')+' Done editing':ico('pencil')+' Edit'}</button>
       <button class="btn" data-act="h_present">${ico('present')} Present</button>
       <button class="btn" data-act="h_export">${ico('share')} Export ${ico('lock')}</button>`)+`
    <div class="jump">${chips}</div>
    <div class="panel house" id="house" style="margin-top:14px"><div class="hh"><span>Ward housekeeping</span><small id="st_house">${esc(stamp(hn))}</small></div>
      ${hoNoteBox(ed,'h_house',hn,'')}</div>
    ${occ.length?'':`<div class="panel empty">No patients yet.<div style="margin-top:12px"><button class="btn primary" data-act="goSetup">${ico('gear')} Open Setup</button></div></div>`}
    ${wing('M','Male')}${wing('F','Female')}`;
}

/* ---------- PRESENTATION – full screen, read down page by page ----------
   Page 1 = housekeeping, then each occupied Male bed, then each occupied Female bed.
   Next / Back, swipe or arrow keys. A- / A+ for text size. Care plans can be switched on. */
let pres=null;
function hoPrefs(){ try{ return Object.assign({ps:1,care:false},JSON.parse(localStorage.getItem('wardHub_prefs'))||{}); }catch(e){ return {ps:1,care:false}; } }
function hoSavePrefs(){ try{ localStorage.setItem('wardHub_prefs',JSON.stringify({ps:pres.ps,care:pres.care})); }catch(e){} }

function hoBlock(head,note){ return `<div class="pblock"><div class="ph"><span>${head}</span>${note.t?`<small>${esc(stamp(note))}</small>`:''}</div><div class="ptext">${note.text.trim()?esc(note.text):'<span class="muted">Nothing to hand over</span>'}</div></div>`; }
function hoOpenPresent(){ const p=hoPrefs(); pres={i:0,ps:p.ps,care:p.care}; $('#present').classList.add('open'); hoDrawPresent(); }
function hoClosePresent(){ pres=null; $('#present').classList.remove('open'); $('#present').innerHTML=''; }

  const last=pres.i===n-1, el=$('#present'); el.style.setProperty('--ps',pres.ps);

// Swipe left/right to turn the page

Object.assign(ACTIONS,{
  // "Edit handover": locked -> ask for the PIN; unlocked -> "Done editing" locks again
  h_edit(){ if(isUnlocked()){ unlockedUntil=0; wasUnlocked=false; if(document.activeElement) document.activeElement.blur(); render(true); toast('Locked'); }
