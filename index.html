<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ============================================================
  WARD HUB – Handover, Diary and Leave in one app, with ONE Setup.
  Single file. No external libraries, no network calls.
  Data lives ONLY in this device's localStorage (key "wardHub_v1") – nothing is sent anywhere.

  SECTIONS
   1. <head> meta  – makes it behave like an app when added to the iPad Home Screen
   2. CSS          – one design system + Diary / Handover / hub-specific styles
   3. HTML shell   – icon sprite, header, #app, #present (presentation overlay), #modal, #toast
   4. JS
      4.1 Core      – config, data store (rooms are set up ONCE), helpers, PIN, navigation
      4.2 Home      – three-box start page
      4.3 Leave     – fireboard, sign out / in, lighters, vape pod, roll call, export
      4.4 Diary     – day view, entries, daily bloods / ECG requests, export
      4.5 Handover  – read / edit, presentation mode, saved document
      4.5b Allocation – Day / Night sheets: door, observations, other tasks, breaks, patient notes
      4.6 Setup     – PIN-protected hub: ward, rooms + S17 leave, retention, backup
      4.7 Main      – shared actions, events, start-up
============================================================ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ward Hub">
<meta name="theme-color" content="#0a2540">
<script>
/* Apply the saved light / dark choice BEFORE first paint (no flash). No saved choice = follow the iPad setting. */
try{var t=localStorage.getItem('wardHub_theme'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
<meta name="format-detection" content="telephone=no">
<title>Ward Hub</title>
<style>
/* ---------- 2. CSS ---------- */
/* Design tokens. Status colours have fixed meanings and are used for nothing else:
   GREEN = in, AMBER = out, RED = overdue / lighter not returned, PURPLE = no leave */
:root{
  --c-handover:#1f6fd6;--c-diary:#5b4bd5;--c-leave:#0a857d;--c-alloc:#1479b4;--c-setup:#475a6e;--navy:#0a2540;--navy2:#0d2e50;--hue1:#2b7be4;--hue2:#6a5be0;--brand:#0b57a4;--brand-soft:#e9f1fa;
  --green:#1e7b4d;--amber:#a85f0a;--red:#bf3a2b;--purple:#6b3a8a;--purple-bg:#6b3a8a;
  --green-soft:#f1f8f4;--amber-soft:#fdf7ea;--red-soft:#fcf0ee;
  --bg:#f3f5f8;--surface:#fff;--surface2:#f7f9fb;--text:#1b2733;--muted:#5f6f7f;--line:#e1e6ec;--line2:#c9d1da;
  --shadow:0 1px 2px rgba(10,37,64,.06);--r:10px;
}
:root{color-scheme:light;--fig:#cfd6de;--figline:#9aa7b4}
/* Theme: follows the iPad setting until the header toggle is used; the toggle stores an explicit light/dark choice.
   Both blocks below hold the SAME dark values so every colour stays consistent. */
:root[data-theme=dark]{
  --c-handover:#2f7fd1;--c-diary:#7366e0;--c-leave:#14998f;--c-alloc:#2a8fc4;--c-setup:#6b8196;--navy:#06121f;--navy2:#0a1b2c;--hue1:#2f7fd1;--hue2:#6a5be0;--brand:#2f7fd1;--brand-soft:#14263a;
  --green:#46b583;--amber:#e0a043;--red:#ef7b6c;--purple:#b48ad6;--purple-bg:#7a4a9c;
  --green-soft:#10231a;--amber-soft:#271f0e;--red-soft:#2d1614;
  --bg:#0b141d;--surface:#121e29;--surface2:#172633;--text:#e6edf3;--muted:#8fa3b5;--line:#223545;--line2:#2f4659;--shadow:none--fig:#3a4d5f;--figline:#6b8196;color-scheme:dark;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --c-handover:#2f7fd1;--c-diary:#7366e0;--c-leave:#14998f;--c-alloc:#2a8fc4;--c-setup:#6b8196;--navy:#06121f;--navy2:#0a1b2c;--hue1:#2f7fd1;--hue2:#6a5be0;--brand:#2f7fd1;--brand-soft:#14263a;
  --green:#46b583;--amber:#e0a043;--red:#ef7b6c;--purple:#b48ad6;--purple-bg:#7a4a9c;
  --green-soft:#10231a;--amber-soft:#271f0e;--red-soft:#2d1614;
  --bg:#0b141d;--surface:#121e29;--surface2:#172633;--text:#e6edf3;--muted:#8fa3b5;--line:#223545;--line2:#2f4659;--shadow:none--fig:#3a4d5f;--figline:#6b8196;color-scheme:dark;}}
*{box-sizing:border-box}
html{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
input,select,textarea,button{font:inherit;color:inherit}
button{cursor:pointer}
/* Icons: inline SVG sprite, drawn in code (see #icons in the HTML) */
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}

/* Header: one centred row (brand | section pills | tools + clock). Wraps to two rows on narrow screens. */
header{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(180deg,var(--navy),var(--navy2));padding:calc(env(safe-area-inset-top) + 10px) 22px 10px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 6px 18px -10px rgba(0,0,0,.55)}
.hl{display:flex;align-items:center;gap:11px;background:none;border:0;color:#fff;text-align:left;padding:0;font:inherit;min-height:44px}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--hue1),var(--hue2));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px -2px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28)}
.mark svg{width:22px;height:22px;fill:#fff}.mark svg .d{opacity:.55}
.htxt{display:flex;flex-direction:column;line-height:1.1}
.logo{font-size:18px;font-weight:700;letter-spacing:-.01em}
#wardName{font-size:12px;opacity:.65;margin-top:2px}
#wardName:empty{display:none}
nav{display:flex;gap:4px;padding:4px;border-radius:15px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
nav button{background:transparent;color:rgba(255,255,255,.72);border:0;border-radius:11px;padding:0 16px;min-height:42px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s}
nav button .ic{width:19px;height:19px}
nav button:active{background:rgba(255,255,255,.12)}
nav button.on{background:#fff;color:#0a2540;box-shadow:0 2px 8px -2px rgba(0,0,0,.45)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
#clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;margin-left:8px;padding-left:16px;border-left:1px solid rgba(255,255,255,.14)}
#clock b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#clock small{font-size:12px;opacity:.65;margin-top:2px}
/* Narrow (iPad portrait): section pills drop to their own full-width row, tool labels shrink to icons */
@media (max-width:900px){
  header{gap:10px 14px}
  .hr{order:2}
  nav{order:3;width:100%}
  nav button{flex:1;justify-content:center;padding:0 8px}
  .hbtn .lbl{display:none}
}

main{padding:20px 20px calc(60px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}
.fade{animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{margin:4px 0 12px;font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{margin:22px 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}

/* Buttons */
.btn{background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:9px 16px;min-height:46px;font-weight:600;transition:background .12s,opacity .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--surface2);opacity:.8}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:active{background:var(--brand);opacity:.85}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.dangerfill{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{color:var(--muted)}
.btn.small{min-height:36px;padding:3px 12px;font-size:14px;border-radius:7px}
.btn:disabled{opacity:.4}

/* Fireboard filter bar (doubles as the In / Out / Overdue counters) */
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.segs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg{background:transparent;border:0;border-right:1px solid var(--line);padding:8px 16px;min-height:44px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center;font-size:15px}
.seg:last-child{border-right:0}
.seg b{background:var(--surface2);color:var(--text);border-radius:6px;padding:0 8px;font-size:14px;min-width:24px;text-align:center}
.seg.on{background:var(--brand-soft);color:var(--brand)}
.seg.on b{background:var(--brand);color:#fff}
.seg.s-over b{background:var(--red);color:#fff}
.seg.s-nl b{background:var(--purple-bg);color:#fff}
.wing{margin:22px 0 10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.alertbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--red-soft);border:1px solid var(--red);color:var(--red);border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.alertbar .alist{display:flex;gap:6px;flex-wrap:wrap}
.alertbar .btn{background:var(--surface);color:var(--red);border-color:var(--red)}
.alertbar .btn.primary{background:var(--red);color:#fff}

/* Room cards */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 12px 18px;display:flex;flex-direction:column;gap:6px;min-height:150px;overflow:hidden;cursor:pointer;transition:border-color .12s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.card:active{border-color:var(--line2)}
.card.out{background:var(--amber-soft)}.card.out::before{background:var(--amber)}
.card.overdue{background:var(--red-soft);border-color:var(--red)}.card.overdue::before{background:var(--red)}
.card.vacant{background:transparent;box-shadow:none;border-style:dashed;min-height:64px;justify-content:center}
.card.vacant::before{display:none}
.ctop{display:flex;justify-content:space-between;align-items:center}
.code{font-weight:700;font-size:18px}
.status{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.out .status{color:var(--amber)}.overdue .status{color:var(--red)}.vacant .status{color:var(--muted)}
.pname{font-size:18px;font-weight:600;min-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlb{background:var(--purple-bg);color:#fff;font-weight:700;letter-spacing:.14em;text-align:center;border-radius:6px;padding:5px 8px;font-size:12px}
.ltbar{display:flex;align-items:center;gap:7px;background:var(--red);color:#fff;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:5px 9px;font-size:12px;text-transform:uppercase}
.detail{font-size:14.5px;line-height:1.4}
.big{font-weight:700;font-size:16px}
.left{font-size:13.5px;color:var(--muted)}
.left.none{color:var(--red);font-weight:600}
.warn{font-size:13px;font-weight:600;color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:3px}
.cb{margin-top:auto;padding-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cb .btn{flex:1;min-width:110px}
.cb .btn.pod{flex:0 0 auto;min-width:0}
.nlbtn{flex:1;text-align:center;border:1px solid var(--purple);color:var(--purple);border-radius:8px;padding:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;min-height:46px;display:flex;align-items:center;justify-content:center}
.podok{font-size:13px;font-weight:600;color:var(--green);white-space:nowrap;display:flex;align-items:center;gap:4px}

/* Panels, forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.hero{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hero h2{margin:0;font-size:24px}
.topnav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
label.f,.fl{display:block;font-weight:600;margin:16px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
input[type=text],input[type=number],input[type=password],input[type=time],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);min-height:46px;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tip{background:var(--brand-soft);border-left:3px solid var(--brand);padding:9px 13px;border-radius:6px;margin:12px 0;font-size:14.5px}
.err{color:var(--red);font-weight:600;min-height:22px;margin-top:6px;font-size:14.5px}
.bad{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
input.bad{border-color:var(--red)}
.chk{display:flex;align-items:center;gap:12px;font-weight:500;padding:6px 0}
input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--brand)}
input[type=checkbox].sw{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;transition:background .2s;border:0}
input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
input[type=checkbox].sw:checked{background:var(--brand)}
input[type=checkbox].sw.pu:checked{background:var(--purple-bg)}
input[type=checkbox].sw:checked::after{transform:translateX(20px)}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
/* Selectable option buttons (leave type, escort level) */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.opt{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:10px 8px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;transition:background .12s,border-color .12s}
.opt small{font-weight:500;color:var(--muted);font-size:12.5px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.sel small{color:var(--brand)}
.opt:disabled{opacity:.35}
.qrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qrow .btn{min-height:36px;padding:3px 13px;border-radius:18px;font-weight:500;font-size:14.5px}
.stepper{display:flex;gap:6px;margin-top:6px}
.stepper .btn{flex:1;min-height:36px;padding:2px 6px;font-size:14.5px}
.repeat{width:100%;margin:12px 0 0;justify-content:flex-start;font-size:14.5px;background:var(--surface2)}
.dots2 i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--brand);margin:0 3px 0 0}
.dots2 i.u{background:var(--line2)}
.achips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.achip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.achip b{display:block;margin-bottom:3px}
.achip.full{background:var(--red-soft);border-color:var(--red)}
.podpanel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--surface2);white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.c{text-align:center}
tr.openrow{background:var(--amber-soft)}
.late{color:var(--red);font-weight:700}

/* Data screen */
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;scroll-margin-top:100px}
summary{padding:12px 16px;font-weight:600;min-height:52px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 10px 0 2px}
details[open] summary::before{transform:rotate(45deg)}
details .in{padding:0 16px 16px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.tag.p{background:var(--purple-bg);border-color:var(--purple-bg);color:#fff}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.arow input[type=number]{width:92px;text-align:center}
.dim{opacity:.3;pointer-events:none}
.auditlog{font-size:14px;max-height:220px;overflow:auto;color:var(--muted)}
.auditlog div{padding:4px 0;border-bottom:1px solid var(--line)}

/* Modal (centred sheet, scrolls inside) */
#modal{display:none;position:fixed;inset:0;background:rgba(8,22,36,.5);z-index:50;align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex;animation:fadeIn .15s}
.sh{background:var(--surface);border-radius:14px;width:100%;max-width:620px;max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:rise .2s ease-out}
.sh.small{max-width:400px}.sh.wide{max-width:840px}
.shh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.shh h2{margin:0;font-size:18px}
.x{background:transparent;border:0;border-radius:8px;width:40px;height:40px;color:var(--muted);flex:none;display:flex;align-items:center;justify-content:center}
.x .ic{width:22px;height:22px}
.shb{padding:4px 18px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.shf{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.shf .btn.primary,.shf .btn.dangerfill{min-width:160px}

/* PIN pad */
.padbody{padding:24px 22px 18px;text-align:center}
.padicon{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.padicon .ic{width:22px;height:22px}
.padbody h2{margin:4px 0 4px;font-size:20px}
.padbody p{margin:0 0 6px;font-size:14.5px}
.dots{display:flex;gap:14px;justify-content:center;margin:16px 0 4px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:background .1s,border-color .1s}
.dots i.f{background:var(--brand);border-color:var(--brand)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px auto 10px;max-width:280px}
.key{height:60px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background .08s}
.key:active{background:var(--brand-soft)}
.key .ic{width:24px;height:24px}

/* Roll call */
.rrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;min-height:58px}
.rrow.isout{background:var(--amber-soft)}
.rrow small{display:block;color:var(--muted);font-size:13.5px}
.rk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.rk .ic{opacity:0;width:16px;height:16px;stroke-width:3}
.rrow.done{border-color:var(--green)}.rrow.done .rk{background:var(--green);border-color:var(--green)}.rrow.done .rk .ic{opacity:1}
.rollcount{font-size:20px;font-weight:700;margin:8px 0}.rollcount.done{color:var(--green)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#14212c;color:#fff;padding:11px 16px;border-radius:10px;z-index:99;display:flex;gap:16px;align-items:center;transition:all .22s;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:transparent;color:#8cc4ff;border:0;font-weight:700;min-height:32px;padding:0 4px;text-transform:uppercase;letter-spacing:.06em;font-size:13px}

/* Export */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;padding:12px 14px}
.rcard h3{margin:0 0 4px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)}
.rcard.none{padding:8px 14px;color:var(--muted);background:transparent}
.printhead{display:none}
.btnrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
@media print{
  header,.noprint,#modal,#toast,#icons{display:none!important}
  html,body{background:#fff;color:#000;font-size:11px}
  main{padding:0;max-width:none}
  .printhead{display:block;margin-bottom:8px}
  .rcard{break-inside:avoid;border:1px solid #000}
  th{background:#ddd!important;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{font-size:11px}
  @page{size:A4 landscape;margin:10mm}
}

/* ---------- Diary-specific ---------- */
.daybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.daybar h2{margin:0}
.strip{display:flex;gap:6px;margin:12px 0 18px}
.dcell{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--muted);font-weight:600;position:relative;min-height:72px;justify-content:center;text-transform:uppercase;letter-spacing:.05em}
.dcell b{font-size:21px;color:var(--text);letter-spacing:0}
.dcell.on{background:var(--brand);border-color:var(--brand);color:#fff}.dcell.on b{color:#fff}
.dcell.today:not(.on){border-color:var(--brand);color:var(--brand)}
.dcell .badge{position:absolute;top:5px;right:6px;background:var(--amber);color:#fff;border-radius:8px;font-size:11px;padding:0 6px;font-style:normal;letter-spacing:0}
.dcell.on .badge{background:#fff;color:var(--brand)}
.stripnav{display:flex;align-items:stretch;gap:6px}
.stripnav .btn{min-height:72px;padding:0 10px}
.dlist{padding:0;overflow:hidden}
.erow{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow.done{background:var(--surface2)}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:2px}
.tick .ic{opacity:0;width:20px;height:20px;stroke-width:3}
.tick.on{background:var(--green);border-color:var(--green)}.tick.on .ic{opacity:1}
.etime{width:64px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;padding-top:7px}
.etime.all{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:9px}
.ebody{flex:1;min-width:0}
.etitle{font-weight:600;font-size:17px}
.erow.done .etitle{text-decoration:line-through;color:var(--muted)}
.emeta{color:var(--muted);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:3px}
.enotes{font-size:14px;margin-top:4px;white-space:pre-wrap}
.edone{font-size:13px;color:var(--green);margin-top:4px;font-weight:600}
.edate{font-weight:700;color:var(--red);font-size:13px}
.sechead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sechead.red{background:var(--red-soft);color:var(--red)}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.daygrp{margin:18px 0 6px;font-weight:700;font-size:13px;color:var(--text);display:flex;justify-content:space-between}
.dtask .etitle{font-size:16px}
.who{font-size:14px;margin-top:3px}
.who span{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-weight:600;font-size:13.5px}
.who .none{background:transparent;color:var(--muted);font-weight:500;padding:0}

/* ---------- Handover-specific ---------- */
.daybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.daybar h2{margin:0}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.jump .btn{min-height:34px;padding:2px 12px;font-size:14px;border-radius:17px;font-weight:500}
.house{border-left:5px solid var(--brand)}
.house .hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.hh small,.shl small{font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
.bed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;scroll-margin-top:76px}
.bed.vac{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:transparent;border-style:dashed;color:var(--muted)}
.bedhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bedhead .room{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);min-width:72px}
.bedhead .nm{font-size:20px;font-weight:700;margin-right:6px}
.bedhead .tag,.ptags .tag{font-size:13px;padding:3px 10px;border-radius:6px}
.tag.sec{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.tag.tone0{color:var(--text)}
.tag.tone1{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tag.tone2{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.tag.unset{border-style:dashed;background:transparent}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:860px){.shifts{grid-template-columns:1fr}}
.shift{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface2);min-width:0}
.shl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.txt{white-space:pre-wrap;font-size:16px;line-height:1.5;min-height:44px;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
textarea.auto{resize:none;min-height:110px;line-height:1.5;overflow:hidden}
details.care{margin:10px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.care summary{min-height:46px;padding:8px 14px}
details.care .in{padding:0 14px 14px}
.editbar{background:var(--brand-soft);border-left:3px solid var(--brand);border-radius:6px;padding:9px 13px;margin:10px 0;font-size:14.5px}
#editBtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:7px 14px;min-height:40px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px}
#editBtn.on{background:#fff;color:var(--navy);border-color:#fff}
.wsub{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.wsub .wing{margin:0}
.addbed{width:100%;min-height:56px;margin:6px 0 14px;border-style:dashed}
.bigopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bigopts .opt{min-height:84px;font-size:18px}

/* ---------- Presentation mode (full screen, read down page by page) ---------- */
#present{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;--ps:1}
#present.open{display:flex}
.ptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--navy);color:#fff}
.ptop b{font-size:17px}
.pcount{opacity:.75;font-variant-numeric:tabular-nums;margin-left:6px}
.ptop .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);min-height:40px}
.ptop .btn.on{background:#fff;color:var(--navy);border-color:#fff}
.pbar{height:4px;background:rgba(255,255,255,.15)}
.pbar i{display:block;height:100%;background:#fff;transition:width .2s}
.pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:28px 40px 40px;font-size:calc(21px * var(--ps))}
.pwrap{max-width:1100px;margin:0 auto}
.pk{font-size:.62em;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.pt{font-size:2.1em;font-weight:700;letter-spacing:-.01em;line-height:1.15;margin:2px 0 10px}
.ptags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ptags .tag{font-size:.75em;padding:4px 12px}
.pblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.ph{font-size:.6em;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.ph small{font-weight:500;text-transform:none;letter-spacing:0}
.ptext{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}
.pbot{display:flex;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.pbot .btn{flex:1;min-height:58px;font-size:18px}
@media (max-width:700px){.pbody{padding:20px 18px 30px}}

/* ---------- Hub-specific: header buttons, home tiles, sub-navigation, pod switch ---------- */
.hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:11px;padding:0 13px;min-height:42px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;transition:background .15s}
.hbtn:active{background:rgba(255,255,255,.18)}
.hbtn.on{background:#fff;color:#0a2540;border-color:#fff}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.subnav .btn{min-height:42px}
.subnav .btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}

/* Home: greeting + four accent-coloured tiles. Each tile has its own hue (cool tones only, so they never read as a status colour). */
.homewrap{max-width:1180px;margin:0 auto;padding-top:clamp(6px,5vh,48px)}
.homehead{margin:0 0 26px}
.hgreet{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.homehead h1{margin:2px 0 0;font-size:38px;letter-spacing:-.03em;line-height:1.1}
.hdate{color:var(--muted);font-size:17px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.tiles{grid-template-columns:1fr}}
.tile{--ac:#2b7be4;position:relative;overflow:hidden;background:var(--surface);background-image:linear-gradient(160deg,color-mix(in srgb,var(--ac) 13%,var(--surface)),var(--surface) 62%);border:1px solid color-mix(in srgb,var(--ac) 28%,var(--line));border-radius:20px;padding:22px 22px 20px;min-height:250px;display:flex;flex-direction:column;align-items:stretch;gap:0;text-align:left;box-shadow:0 10px 26px -16px color-mix(in srgb,var(--ac) 70%,transparent);transition:transform .15s,box-shadow .15s}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--ac)}
.tile:active{transform:scale(.985)}
.t-handover{--ac:#2b7be4}.t-diary{--ac:#6a5be0}.t-leave{--ac:#0f9d94}.t-alloc{--ac:#1e90c8}
.thead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tile .ticon{width:56px;height:56px;border-radius:16px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -8px var(--ac)}
.tile .ticon .ic{width:28px;height:28px}
.tgo{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.tile h2{margin:0;font-size:22px;letter-spacing:-.01em}
.tbig{margin-top:auto;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding-top:14px}
.tbig b{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.04em;color:var(--ac);font-variant-numeric:tabular-nums}
.tbig span{color:var(--muted);font-size:16px;font-weight:600}
.tnote{min-height:22px;margin-top:6px;font-size:14.5px;font-weight:600;color:var(--muted)}
.tile .rd{color:var(--red);font-weight:700}
.homefoot{margin-top:22px;display:flex;justify-content:flex-end}

/* Vape pod switch row (on fireboard cards and the room page) */
.podrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:9px 0 2px;margin-top:4px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.swv{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.swv::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.swv.on{background:var(--green)}.swv.on::after{transform:translateX(18px)}
.podrow.on{color:var(--green)}
.hint{font-size:13px;color:var(--muted);margin-top:3px}

/* ---------- Section accent: every page takes its tile's colour (--brand follows it, so buttons, tags and focus rings all match) ---------- */
body[data-sec=handover]{--ac:var(--c-handover)}body[data-sec=diary]{--ac:var(--c-diary)}body[data-sec=leave]{--ac:var(--c-leave)}body[data-sec=alloc]{--ac:var(--c-alloc)}body[data-sec=setup]{--ac:var(--c-setup)}
body[data-sec]:not([data-sec=home]){--brand:var(--ac);--brand-soft:color-mix(in srgb,var(--ac) 12%,var(--surface))}
.t-handover{--ac:var(--c-handover)}.t-diary{--ac:var(--c-diary)}.t-leave{--ac:var(--c-leave)}.t-alloc{--ac:var(--c-alloc)}

/* Section heading card */
.phead{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px 14px 22px;margin:0 0 16px;border-radius:18px;border:1px solid color-mix(in srgb,var(--ac,var(--brand)) 26%,var(--line));background:linear-gradient(115deg,color-mix(in srgb,var(--ac,var(--brand)) 13%,var(--surface)),var(--surface) 72%)}
.phead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac,var(--brand))}
.pico{width:48px;height:48px;border-radius:14px;background:var(--ac,var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 16px -9px var(--ac,var(--brand))}
.pico .ic{width:25px;height:25px}
.pt2{flex:1;min-width:180px}
.pt2 h2{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.15}
.psub{color:var(--muted);font-size:15px;margin-top:2px}
.pact{display:flex;gap:8px;flex-wrap:wrap}

/* Sub-navigation: one rounded pill group, active tab filled with the section colour */
.subnav{display:inline-flex;gap:4px;padding:4px;margin:0 0 16px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);flex-wrap:wrap}
.subnav .btn{min-height:42px;border:0;background:transparent;border-radius:11px;padding:0 18px;font-weight:600;color:var(--muted);box-shadow:none}
.subnav .btn.on{background:var(--ac,var(--brand));color:#fff;box-shadow:0 3px 10px -4px var(--ac,var(--brand))}
.subnav .btn.on .ic{color:#fff}

/* Shared card / heading polish */
h3{display:flex;align-items:center;gap:9px}
h3::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--ac,var(--brand));flex:none}
.btn.primary{background:var(--ac,var(--brand));border-color:var(--ac,var(--brand));box-shadow:0 4px 12px -6px var(--ac,var(--brand))}
.bed,.pc,.panel,.pcard,.altw,.card{border-radius:16px}

/* Day / Night switch matches the sub-navigation pills */
.alseg{border-radius:15px;padding:4px;gap:4px;background:var(--surface2);border:1px solid var(--line);margin:0 0 16px 8px;vertical-align:top;overflow:visible}
.alseg button{border-radius:11px;min-height:46px;padding:2px 24px}
.alseg button.on{background:var(--ac,var(--brand));color:#fff;box-shadow:0 3px 10px -4px var(--ac,var(--brand))}
.subnav .btn{min-height:46px}
.btn{border-radius:11px}

.opt.primary small{color:rgba(255,255,255,.85)}

/* ---------- Clothing picker (Leave sign-out) + figure ---------- */
.wearbox{display:flex;gap:16px;align-items:flex-start}
.figcol{flex:none;width:132px;position:sticky;top:0;text-align:center}
.fig{width:132px;height:auto;display:block}
.fig .slot{cursor:pointer}
.fig .slot.on *{stroke:var(--brand);stroke-width:1.8}
.fig .ghost{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:3 3}
.figsex{display:inline-flex;margin-top:6px;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.figsex button{border:0;background:var(--surface);padding:6px 12px;min-height:34px;font-weight:600;font-size:13px;color:var(--muted)}
.figsex button.on{background:var(--brand-soft);color:var(--brand)}
.wlist{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:54px}
.wrow.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.wrow .dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);flex:none;background:var(--surface2)}
.wrow b{display:block;font-size:14px}
.wrow small{display:block;color:var(--muted);font-size:13px}
.wrow .need{color:var(--red)}
.wrow.add{border-style:dashed;color:var(--brand);font-weight:600;background:transparent}
.wrow .ic.r{margin-left:auto;color:var(--muted)}
.wpanel{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px;margin:-2px 0 4px}
.wpanel .opts{grid-template-columns:repeat(3,1fr);gap:8px}
.wpanel .opt{min-height:48px;padding:6px;font-size:14px}
.cgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px}
.cs{width:100%;aspect-ratio:1;max-width:46px;min-height:36px;border-radius:50%;border:1px solid var(--line2);padding:0;position:relative}
.cs.sel{outline:3px solid var(--brand);outline-offset:2px}
.cs.multi{background:conic-gradient(#d33,#e8801f,#f2cc2e,#2f9a55,#2b6fd1,#7a45b5,#d33)}
.cs.camo{background:radial-gradient(circle at 30% 30%,#5d6b2f 0 30%,transparent 31%),radial-gradient(circle at 70% 60%,#4a3a28 0 28%,transparent 29%),#8c8a55}
.wpat{display:flex;gap:22px;align-items:center;margin-top:12px;flex-wrap:wrap}
.wpat .chk{padding:2px 0}
.wact{display:flex;gap:8px;justify-content:space-between;margin-top:12px}
.wname{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
@media (max-width:560px){.wearbox{flex-direction:column;align-items:stretch}.figcol{position:static;width:auto}.fig{margin:0 auto;width:110px}}
.tipfig{display:flex;gap:14px;align-items:center}.tipfig .fig{width:64px;flex:none}
/* header theme toggle */
.hbtn.sq{padding:0;width:42px;justify-content:center}

/* ---------- Allocation app ---------- */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.pcard .top{display:flex;gap:10px;align-items:center}
.pcard .top input{flex:1;font-weight:600}
.checks{display:flex;gap:26px;flex-wrap:wrap;margin:10px 0 4px}
.alshifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.alshifts .opt{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;padding:6px}
.alshifts .opt small{font-weight:500;font-size:12px;color:var(--muted)}
.alshifts .opt.sel small{color:inherit}
.rolehead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.rolehead h3{margin:0}
.addp{width:100%;justify-content:center;border-style:dashed;margin-top:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pc .role{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.pc .alnm{font-size:19px;font-weight:700;margin:3px 0 8px}
.pc .alnm.unset{color:var(--muted);font-weight:500}
.pc .tags{display:flex;gap:6px;flex-wrap:wrap}
.pc.lead{border-left:4px solid var(--brand)}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:6px}
.cover .pc .alnm{margin-bottom:0}
.byshift{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.byshift .pc .alnm{font-size:16px;margin:2px 0 0;font-weight:600}
.byshift .pc .alnm+.alnm{margin-top:4px}
.pending{border:1px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
.sheethead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sheethead .muted{margin:0}
/* allocation grid + notes */
.altw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.atable{width:100%;border-collapse:collapse;font-size:14px}
.atable th,.atable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.atable thead th,.atable tr:first-child th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface2)}
.atable tbody th,.atable tr>th:first-child{font-weight:600;white-space:nowrap}
.atable tr:last-child>*{border-bottom:0}
.atable td.off{color:var(--muted);font-style:italic;background:var(--surface2)}
.atable td.alempty{color:var(--muted)}
.atable tr.sep td{background:var(--surface2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:6px 10px}
.atable tr.now>*{background:var(--brand-soft)}
.atable select{min-height:38px;padding:4px 8px;font-size:14px;width:100%;min-width:110px}
.atable select.bad{border-color:var(--red)}
.cover3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cover3 .pc .alnm{margin-bottom:0;font-size:17px}
.pc .ln{margin-top:10px;font-size:14px}.pc .ln b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.pts{display:flex;flex-wrap:wrap;gap:6px}.alpt{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
.sm{font-size:12px;font-weight:400}
.brow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}.brow span{font-weight:600}.brow select{max-width:240px}
.row2.tri{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* Day / Night switch */
.alseg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--surface);margin-bottom:16px}
.alseg button{border:0;background:transparent;padding:8px 26px;min-height:52px;font-weight:700;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.alseg button small{font-size:11px;font-weight:500;opacity:.85}
.alseg button.on{background:var(--brand);color:#fff}

</style>
</head>

<script>
"use strict";
"use strict";
/* ============================================================
   CORE – shared by every section
   1. Config      – leave types, escort levels, diary categories, MHA sections, obs levels (edit these)
   2. Data store  – ONE database for the whole hub (rooms are set up once and used by all three sections)
   3. Helpers     – dates, modal / confirm / toast / file saving
   4. PIN         – ONE 4-digit PIN for every locked area
   5. Navigation  – Home, Handover, Diary, Leave, Setup
============================================================ */

/* ---------- 1. CONFIG ---------- */
// LEAVE. mins = how long after leaving the patient is due back (auto-fills "due back"); null = set by hand.
const LEAVE_TYPES = [
  {key:'15m',  label:'15 minutes', short:'15m',  mins:15,   defCount:9},
  {key:'30m',  label:'30 minutes', short:'30m',  mins:30,   defCount:2},
  {key:'1-2h', label:'1–2 hours',  short:'1-2h', mins:60,   defCount:1},
  {key:'4h',   label:'4 hours',    short:'4h',   mins:240,  defCount:1},
  {key:'6h',   label:'6 hours',    short:'6h',   mins:360,  defCount:1},
  {key:'home', label:'Home leave', short:'Home', mins:null, defCount:1}
];
const typeLabel = k => (LEAVE_TYPES.find(t=>t.key===k)||{label:k||''}).label;
const ESCORT_LEVELS = [
  {key:'unescorted',  label:'Unescorted',  short:'Unesc', needsName:false},
  {key:'escorted',    label:'Escorted',    short:'Esc',   needsName:true},
  {key:'accompanied', label:'Accompanied', short:'Acc',   needsName:true}
];
const escLabel = k => (ESCORT_LEVELS.find(l=>l.key===k)||{label:k||''}).label;
const QUICK_LOCATIONS = ['Shop','Smoke','Home','Town','Walk','Garden'];

// DIARY
const DIARY_CATS = [
  {key:'appt',  label:'Escort / appointment', needsPerson:true},
  {key:'visit', label:'Visit',                needsPerson:true},
  {key:'other', label:'Other',                needsPerson:false}
];
const dcat = k => DIARY_CATS.find(c=>c.key===k) || {label:k||'',needsPerson:false};
const QUICK_TITLES = [['Family visit','visit'],['Carers visit','visit'],['OT visit','visit'],['Escort to appointment','appt']];
// Daily requests: viewing day D shows each one "for D+1". Tap it, add people, mark submitted.
const DAILY_TASKS = [{key:'bloods',label:'Submit bloods requests',short:'Bloods'},{key:'ecg',label:'Submit ECG requests',short:'ECG'}];

// HANDOVER
const SHIFTS = [{key:'early',label:'Early'},{key:'late',label:'Late'},{key:'night',label:'Night'}];
const SECTIONS = ['Informal','S2','S3','S35','S36','S37','S37/41','S38','S45A','S47','S47/49','S48','S48/49','S136','Other'];
// tone drives the tag colour: 0 plain, 1 amber, 2 red
const OBS = [{key:'L1',label:'Level 1',tone:0},{key:'2x2',label:'2x2',tone:1},{key:'2x4',label:'2x4',tone:1},{key:'L3',label:'Level 3',tone:2},{key:'L4',label:'Level 4',tone:2}];
const obsOf = k => OBS.find(o=>o.key===k);

const AUTOLOCK_MS = 3*60*1000;   // locked areas re-lock after 3 minutes without a tap or key press

/* ---------- 2. DATA STORE (localStorage, this device only) ----------
   db = { pinHash,
          settings:{wardName,nameDisplay,leaveRetention,diaryRetention,docCare},
          rooms:[ {id,sex:'M'|'F',label,name,section,sectionOther,obs,        // set up ONCE in Setup
                   noLeave,allow:{'15m':9,..},escort:{..},s17,                  // S17 leave (used by Leave)
                   early,late,night,care:{text,t}} ],                           // handover notes (used by Handover)
          entries:[leave sign-outs], pods:[vape pods], diary:[diary entries], requests:{ 'date|bloods':{people,done} },
          house:{text,t}, audit:[] }
   allow[type] = how many of that leave per day (0/absent = NOT permitted). */
const KEY='wardHub_v1';
let _u=0; const uid=()=>Date.now().toString(36)+(++_u).toString(36)+Math.random().toString(36).slice(2,5);
const emptyNote=()=>({text:'',t:''});
function newRoom(sex,label){ return {id:uid(),sex,label,name:'',section:'',sectionOther:'',obs:'',noLeave:false,allow:{},escort:{unescorted:false,escorted:false,accompanied:false},s17:'',early:emptyNote(),late:emptyNote(),night:emptyNote(),care:emptyNote()}; }
// A fresh install starts with Male 1-13 and Female 1-5. Add / remove beds in Setup.
function seedRooms(){ const r=[]; for(let i=1;i<=13;i++) r.push(newRoom('M','Male '+i)); for(let i=1;i<=5;i++) r.push(newRoom('F','Female '+i)); return r; }
const blankDb=()=>({pinHash:null,settings:{wardName:'',nameDisplay:'full',leaveRetention:30,diaryRetention:90,docCare:true},
  rooms:seedRooms(),entries:[],pods:[],diary:[],requests:{},house:emptyNote(),audit:[]});
let db=load();
function load(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d){ const b=blankDb(); const m=Object.assign(b,d,{settings:Object.assign(b.settings,d.settings||{})}); if(!Array.isArray(m.rooms)) m.rooms=seedRooms(); return m; } }catch(e){}
  return blankDb();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){ toast('WARNING: could not save – storage blocked or full'); } }
function audit(m){ db.audit.push({t:new Date().toISOString(),m}); if(db.audit.length>300) db.audit.splice(0,db.audit.length-300); }

// Room helpers: the single source of truth for every section
const roomById = id => db.rooms.find(r=>r.id===id);
const roomsOf  = sex => db.rooms.filter(r=>r.sex===sex).map(r=>r.id);
const allIds   = () => roomsOf('M').concat(roomsOf('F'));            // male first, then female
const roomLabel= id => (roomById(id)||{label:'Bed'}).label;
const isOcc    = r => !!(r&&r.name.trim());
const occupied = sex => db.rooms.filter(r=>r.sex===sex&&isOcc(r));
const occAll   = () => occupied('M').concat(occupied('F'));
const secLabel = r => r.section==='Other'?(r.sectionOther.trim()||'Other'):r.section;
const noteOf   = (r,k) => r[k]||emptyNote();
const permTypes= r => r.noLeave?[]:LEAVE_TYPES.filter(t=>(r.allow[t.key]||0)>0);
const permEsc  = r => r.noLeave?[]:ESCORT_LEVELS.filter(l=>r.escort[l.key]);

/* ---------- 3. HELPERS ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ico=(n,c)=>`<svg class="ic ${c||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const yn=b=>b?'Yes':'–';
function todayStr(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowHHMM(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function addMins(hhmm,m){ const [h,mi]=hhmm.split(':').map(Number); const t=(((h*60+mi+m)%1440)+1440)%1440; return pad(Math.floor(t/60))+':'+pad(t%60); }
function toDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
const dateAdd=(s,n)=>{ const d=toDate(s); d.setDate(d.getDate()+n); return todayStr(d); };
const fmtDate=(s,short)=>toDate(s).toLocaleDateString('en-GB',short?{weekday:'short',day:'numeric',month:'short'}:{weekday:'long',day:'numeric',month:'long',year:'numeric'});
// Date + "HH:MM" -> Date. If the time is earlier than relativeTo we assume it's after midnight (next day).
function dtOf(date,hhmm,relativeTo){
  const [y,mo,d]=date.split('-').map(Number), [h,mi]=hhmm.split(':').map(Number);
  let x=new Date(y,mo-1,d,h,mi); if(relativeTo&&hhmm<relativeTo) x=new Date(x.getTime()+86400000); return x;
}
// "Updated 14:05" (today) or "Updated Sat 14:05"
function stamp(n){
  if(!n||!n.t) return ''; const d=new Date(n.t), same=d.toDateString()===new Date().toDateString();
  return 'Updated '+(same?'':d.toLocaleDateString('en-GB',{weekday:'short'})+' ')+pad(d.getHours())+':'+pad(d.getMinutes());
}
// Section / observation tags (used by Handover and Setup)
const tagsHTML=r=>{ const sec=secLabel(r), o=obsOf(r.obs);
  return `<span class="tag ${sec?'sec':'unset'}">${sec?esc(sec):'Section not set'}</span><span class="tag ${o?'tone'+o.tone:'unset'}">${o?'Obs '+esc(o.label):'Obs not set'}</span>`; };
// Fireboard privacy: full name / initials / room only (set in Setup)
function dispName(n){
  if(!n) return ''; const m=db.settings.nameDisplay;
  if(m==='room') return '';
  if(m==='initials') return n.trim().split(/\s+/).map(w=>w[0].toUpperCase()).join('.')+'.';
  return n;
}

let toastT, undoFn=null;
function toast(msg,undo){
  const t=$('#toast'); undoFn=undo||null;
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-act="toastUndo">Undo</button>':'');
  t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('show');undoFn=null;},undo?7000:3000);
}
// Modal: sheet() builds the standard header / scrolling body / sticky footer
function sheet(title,body,foot,size){
  return `<div class="sh ${size||''}"><div class="shh"><h2>${title}</h2><button class="x" data-act="closeModal" aria-label="Close">${ico('x')}</button></div><div class="shb">${body}</div><div class="shf">${foot}</div></div>`;
}
function showModal(html){ const m=$('#modal'); m.innerHTML=html; m.classList.add('open'); }
function closeModal(){ const m=$('#modal'); m.classList.remove('open'); m.innerHTML=''; pad_=null; }
const modalOpen=()=>$('#modal').classList.contains('open');
// In-app confirmation dialog (the browser's confirm() is unreliable in Home Screen apps)
let askYes=null, askNo=null;
function ask(o,yes,no){
  askYes=yes; askNo=no||null;
  showModal(sheet(esc(o.title),`<p style="margin:14px 0 6px">${o.msg}</p>`,
    `<button class="btn ghost" data-act="askNo">Cancel</button><button class="btn ${o.danger?'dangerfill':'primary'}" data-act="askYes">${esc(o.ok||'Confirm')}</button>`,'small'));
}
function download(name,text,type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
// Save a file: iPad share sheet (Save to Files / AirDrop / Print) where available, otherwise a normal download
function saveFile(name,text,type){
  let f=null; try{ f=new File([text],name,{type}); }catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:name}).catch(err=>{ if(!err||err.name!=='AbortError') download(name,text,type); }); return; }
  download(name,text,type);
}
const csvOf=rows=>rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
// Highlight the field that failed validation, show the message, scroll to it
function fail(msg,id){
  document.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));
  const el=$('#'+id);
  if(el){ el.classList.add('bad'); el.scrollIntoView({block:'center',behavior:'smooth'}); if(/INPUT|TEXTAREA/.test(el.tagName)) el.focus({preventScroll:true}); }
  const e=$('#formErr'); if(e) e.textContent=msg;
}
// Make a textarea as tall as its text (no inner scrolling)
function grow(el){ el.style.height='auto'; el.style.height=Math.max(el.scrollHeight+2,110)+'px'; }
const growAll=()=>document.querySelectorAll('textarea.auto').forEach(grow);

/* ---------- 4. PIN – ONE 4-digit PIN guards everything locked ----------
   Locked areas: Setup, Leave export, Diary export, deleting entries, reversing a vape pod / undoing a request, EDITING the handover.
   First launch: the very first thing shown is "create a PIN" (cannot be skipped).
   Unlocked sessions last 3 idle minutes. A soft lock for a shared iPad – data is not encrypted. Also use the iPad passcode / Guided Access. */
let unlockedUntil=0, wasUnlocked=false, fails=0, lockoutUntil=0, pad_=null, justSetup=false;
const isUnlocked=()=>Date.now()<unlockedUntil;
function unlock(){ unlockedUntil=Date.now()+AUTOLOCK_MS; wasUnlocked=true; }
async function hashPin(p){
  const s='wardhub:'+p;
  if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h=5381; for(const c of s) h=((h<<5)+h+c.charCodeAt(0))|0; return 'x'+h;   // fallback if not https
}
// On-screen keypad with dots; auto-submits on the 4th digit. onDone(pin) returns an error string to reject (dots shake).
function pinPad(o){
  pad_={buf:'',busy:false,o};
  showModal(`<div class="sh small"><div class="padbody"><div class="padicon">${ico('lock')}</div><h2>${o.title}</h2><p class="muted">${o.sub||''}</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="err" id="padErr"></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-act="pd" data-v="${n}">${n}</button>`).join('')}<span></span><button class="key" data-act="pd" data-v="0">0</button><button class="key" data-act="pd" data-v="del" aria-label="Delete">${ico('backspace')}</button></div>
    ${o.cancel===false?'':'<button class="btn ghost" data-act="padCancel">Cancel</button>'}</div></div>`);
  if(o.msg) $('#padErr').textContent=o.msg;
}
async function padKey(v){
  const p=pad_; if(!p||p.busy) return;
  if(v==='del') p.buf=p.buf.slice(0,-1); else if(p.buf.length<4) p.buf+=v;
  [...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<p.buf.length));
  if(p.buf.length===4){
    p.busy=true; const res=await p.o.onDone(p.buf);
    if(typeof res==='string'&&pad_===p){
      p.buf=''; p.busy=false; $('#padErr').textContent=res;
      const d=$('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); [...d.children].forEach(x=>x.classList.remove('f'));
    }
  }
}
function requirePin(cb){
  if(!db.pinHash){ startSetup(); return; }
  if(isUnlocked()){ cb(); return; }
  pinPad({title:'Enter PIN',sub:'Staff only',onDone:async p=>{
    if(Date.now()<lockoutUntil) return 'Too many attempts – wait 30 seconds';
    if(await hashPin(p)!==db.pinHash){ fails++; if(fails>=5){ lockoutUntil=Date.now()+30000; fails=0; } return 'Incorrect PIN'; }
    fails=0; unlock(); closeModal(); cb&&cb();
  }});
}
// First-run: create + confirm the single PIN. Not cancellable. Then straight into Setup.
function startSetup(msg){
  pinPad({title:'Welcome – create a PIN',cancel:false,msg,
    sub:'Choose a 4-digit PIN for Setup, exports and editing. It cannot be recovered.',
    onDone:p1=>{ pinPad({title:'Confirm your PIN',sub:'Enter it once more',cancel:false,onDone:async p2=>{
      if(p2!==p1){ startSetup("PINs didn't match – start again"); return; }
      db.pinHash=await hashPin(p1); audit('PIN created'); save(); unlock(); closeModal(); justSetup=true; go('setup'); toast('PIN set – now set up your patients');
    }}); }});
}
function changePin(){
  pinPad({title:'New PIN',sub:'Enter a new 4-digit PIN',onDone:p1=>{ pinPad({title:'Confirm new PIN',sub:'Enter it once more',onDone:async p2=>{
    if(p2!==p1) return "PINs didn't match";
    db.pinHash=await hashPin(p1); audit('PIN changed'); save(); closeModal(); toast('PIN changed');
  }}); }});
}
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{ if(isUnlocked()) unlockedUntil=Date.now()+AUTOLOCK_MS; },true));

   app: 'home' | 'handover' | 'diary' | 'leave' | 'setup'. Each section keeps its own small state object. */
let app='home', lastHtml='';
const lv={view:'board',room:null,filter:'all',exportDate:todayStr()};          // Leave
const dy={view:'day',sel:todayStr(),from:todayStr(),to:todayStr()};              // Diary
const st={open:new Set()};                                                        // Setup (which room editors are open)
const ACTIONS={};                                                                 // every section adds its actions here

function go(a,sub,extra){
  app=a;
  if(a==='leave'){ lv.view=sub||'board'; if(extra!==undefined) lv.room=extra; }
  else if(a==='diary'){ dy.view=sub||'day'; }
  render(true); window.scrollTo(0,0);
}
function render(fresh){
  document.body.dataset.sec=app;                              // section accent colour (see hub.css)
  $('#wardName').textContent=db.settings.wardName;
  ['handover','diary','leave','alloc'].forEach(n=>$('#nav-'+n).classList.toggle('on',app===n));
  $('#setupBtn').classList.toggle('on',app==='setup');
  $('#lockBtn').style.display=isUnlocked()?'':'none';
  const html=app==='home'?viewHome():app==='leave'?lvView():app==='diary'?dyView():app==='handover'?hoView():app==='alloc'?alView():stView();
  if(!fresh&&html===lastHtml) return;                       // nothing changed – don't redraw (no flicker)
  lastHtml=html; const el=$('#app'); el.innerHTML=html; growAll();
  if(fresh){ el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); }
}
